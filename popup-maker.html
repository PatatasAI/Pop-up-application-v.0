<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-up Maker - Instant Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .canvas-area { background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px; }
        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }
        .preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .preview-popup { background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%; position: relative; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-preview { position: absolute; top: 10px; right: 10px; cursor: pointer; color: #6b7280; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">P</div>
            <h1 class="text-xl font-bold text-gray-800">Pop-up Maker <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full ml-2">Instant Edition</span></h1>
        </div>
        <div class="flex gap-3">
            <button onclick="togglePreview()" class="flex items-center gap-2 px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md transition">
                <i class="fas fa-eye"></i> Preview
            </button>
            <button onclick="exportCode()" class="flex items-center gap-2 px-4 py-2 text-white bg-indigo-600 hover:bg-indigo-700 rounded-md transition shadow-sm">
                <i class="fas fa-code"></i> Get Code
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar: Elements & Templates -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-0">
            <div class="p-4 border-b border-gray-100">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Elements</h2>
                <div class="space-y-2">
                    <div draggable="true" ondragstart="drag(event)" data-type="headline" class="draggable-item p-3 bg-gray-50 border border-gray-200 rounded hover:border-indigo-500 hover:bg-indigo-50 transition flex items-center gap-3">
                        <i class="fas fa-heading text-gray-400"></i> <span class="text-sm font-medium">Headline</span>
                    </div>
                    <div draggable="true" ondragstart="drag(event)" data-type="text" class="draggable-item p-3 bg-gray-50 border border-gray-200 rounded hover:border-indigo-500 hover:bg-indigo-50 transition flex items-center gap-3">
                        <i class="fas fa-paragraph text-gray-400"></i> <span class="text-sm font-medium">Text Block</span>
                    </div>
                    <div draggable="true" ondragstart="drag(event)" data-type="button" class="draggable-item p-3 bg-gray-50 border border-gray-200 rounded hover:border-indigo-500 hover:bg-indigo-50 transition flex items-center gap-3">
                        <i class="fas fa-square text-gray-400"></i> <span class="text-sm font-medium">Button</span>
                    </div>
                    <div draggable="true" ondragstart="drag(event)" data-type="image" class="draggable-item p-3 bg-gray-50 border border-gray-200 rounded hover:border-indigo-500 hover:bg-indigo-50 transition flex items-center gap-3">
                        <i class="fas fa-image text-gray-400"></i> <span class="text-sm font-medium">Image</span>
                    </div>
                </div>
            </div>
            
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Templates</h2>
                <div class="grid grid-cols-1 gap-3">
                    <div onclick="loadTemplate('newsletter')" class="cursor-pointer group relative aspect-video bg-gray-100 rounded border border-gray-200 overflow-hidden hover:ring-2 hover:ring-indigo-500 transition">
                        <div class="absolute inset-0 flex flex-col items-center justify-center p-2 text-center">
                            <div class="w-8 h-8 bg-blue-100 rounded-full mb-2"></div>
                            <div class="h-2 w-20 bg-gray-300 rounded mb-1"></div>
                            <div class="h-2 w-12 bg-gray-300 rounded"></div>
                        </div>
                        <span class="absolute bottom-1 right-1 text-[10px] bg-white/80 px-1 rounded">Newsletter</span>
                    </div>
                    <div onclick="loadTemplate('discount')" class="cursor-pointer group relative aspect-video bg-gray-100 rounded border border-gray-200 overflow-hidden hover:ring-2 hover:ring-indigo-500 transition">
                        <div class="absolute inset-0 flex flex-col items-center justify-center p-2 text-center">
                            <div class="text-2xl font-bold text-red-400 mb-1">50% OFF</div>
                            <div class="h-6 w-20 bg-red-500 rounded"></div>
                        </div>
                        <span class="absolute bottom-1 right-1 text-[10px] bg-white/80 px-1 rounded">Discount</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Canvas -->
        <main class="flex-1 canvas-area relative overflow-auto flex items-center justify-center p-8">
            <div id="canvas" class="w-[400px] min-h-[500px] bg-white shadow-xl rounded-lg relative border border-gray-200 transition-all duration-200" 
                 ondrop="drop(event)" ondragover="allowDrop(event)">
                
                <!-- Default Content -->
                <div class="p-6 text-center space-y-4">
                    <h2 class="text-2xl font-bold text-gray-800 editable" contenteditable="true">Welcome!</h2>
                    <p class="text-gray-600 editable" contenteditable="true">Subscribe to get special offers.</p>
                    <button class="px-6 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">Subscribe</button>
                </div>

                <!-- Close Button (Visual only in editor) -->
                <div class="absolute top-2 right-2 text-gray-400 hover:text-gray-600 cursor-pointer">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            
            <div class="absolute bottom-4 right-4 bg-white p-3 rounded-lg shadow border border-gray-200 text-xs text-gray-500">
                <i class="fas fa-info-circle mr-1"></i> Drag elements from left. Click text to edit.
            </div>
        </main>

        <!-- Properties Panel -->
        <aside class="w-72 bg-white border-l border-gray-200 p-4 overflow-y-auto z-0">
            <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Settings</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Trigger Type</label>
                    <select class="w-full border-gray-300 rounded-md shadow-sm text-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
                        <option>On Page Load</option>
                        <option>Exit Intent</option>
                        <option>Scroll 50%</option>
                        <option>Time Delay (5s)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Background Color</label>
                    <div class="flex gap-2">
                        <button onclick="changeBg('white')" class="w-8 h-8 rounded-full border border-gray-300 bg-white"></button>
                        <button onclick="changeBg('black')" class="w-8 h-8 rounded-full border border-gray-300 bg-gray-900"></button>
                        <button onclick="changeBg('indigo')" class="w-8 h-8 rounded-full border border-gray-300 bg-indigo-600"></button>
                        <button onclick="changeBg('gradient')" class="w-8 h-8 rounded-full border border-gray-300 bg-gradient-to-r from-pink-500 to-orange-400"></button>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Display Rules</label>
                    <div class="flex items-center gap-2 mb-2">
                        <input type="checkbox" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span class="text-sm text-gray-600">Desktop</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span class="text-sm text-gray-600">Mobile</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="preview-overlay" onclick="if(event.target === this) togglePreview()">
        <div class="preview-popup" id="previewContent">
            <!-- Content injected via JS -->
        </div>
    </div>

    <!-- Code Modal -->
    <div id="codeModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="font-bold text-lg">Your Pop-up Code</h3>
                <button onclick="document.getElementById('codeModal').classList.add('hidden')" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 overflow-auto flex-1 bg-gray-50">
                <pre id="codeOutput" class="text-xs text-gray-700 font-mono whitespace-pre-wrap"></pre>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end gap-2">
                <button onclick="document.getElementById('codeModal').classList.add('hidden')" class="px-4 py-2 text-gray-700 bg-gray-100 rounded hover:bg-gray-200">Close</button>
                <button onclick="copyCode()" class="px-4 py-2 text-white bg-indigo-600 rounded hover:bg-indigo-700">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        // Drag and Drop Logic
        function allowDrop(ev) { ev.preventDefault(); }
        
        function drag(ev) {
            ev.dataTransfer.setData("type", ev.target.dataset.type);
        }

        function drop(ev) {
            ev.preventDefault();
            const type = ev.dataTransfer.getData("type");
            const canvas = document.getElementById('canvas');
            
            // Remove default empty state if exists
            if(canvas.children.length === 2 && canvas.querySelector('.text-center')) {
                canvas.innerHTML = '<div class="absolute top-2 right-2 text-gray-400 hover:text-gray-600 cursor-pointer"><i class="fas fa-times"></i></div>';
            }

            let element;
            if (type === 'headline') {
                element = document.createElement('h3');
                element.className = "text-xl font-bold text-gray-800 mt-4 editable" ;
                element.contentEditable = "true";
                element.innerText = "New Headline";
            } else if (type === 'text') {
                element = document.createElement('p');
                element.className = "text-gray-600 mt-2 editable";
                element.contentEditable = "true";
                element.innerText = "Add your description here.";
            } else if (type === 'button') {
                element = document.createElement('button');
                element.className = "mt-4 px-6 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition editable";
                element.contentEditable = "true";
                element.innerText = "Click Me";
            } else if (type === 'image') {
                element = document.createElement('div');
                element.className = "mt-4 h-32 bg-gray-200 rounded flex items-center justify-center text-gray-400";
                element.innerHTML = '<i class="fas fa-image text-2xl"></i><span class="ml-2 text-sm">Image Placeholder</span>';
            }

            if(element) {
                // Insert before the close button (last child)
                const closeBtn = canvas.lastElementChild;
                canvas.insertBefore(element, closeBtn);
            }
        }

        // Template Logic
        function loadTemplate(type) {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = `<div class="absolute top-2 right-2 text-gray-400 hover:text-gray-600 cursor-pointer"><i class="fas fa-times"></i></div>`;
            
            if (type === 'newsletter') {
                canvas.innerHTML += `
                    <div class="p-6 text-center">
                        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600"><i class="fas fa-envelope"></i></div>
                        <h2 class="text-2xl font-bold text-gray-800 editable" contenteditable="true">Join Our Newsletter</h2>
                        <p class="text-gray-600 mt-2 mb-6 editable" contenteditable="true">Get the latest updates sent straight to your inbox.</p>
                        <input type="email" placeholder="Enter your email" class="w-full p-2 border border-gray-300 rounded mb-3">
                        <button class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700 editable" contenteditable="true">Subscribe Now</button>
                    </div>
                `;
            } else if (type === 'discount') {
                canvas.innerHTML += `
                    <div class="p-6 text-center bg-red-50 h-full rounded-b-lg">
                        <h2 class="text-3xl font-extrabold text-red-600 my-4 editable" contenteditable="true">FLASH SALE<br>50% OFF</h2>
                        <p class="text-gray-700 mb-6 editable" contenteditable="true">Use code: SAVE50</p>
                        <button class="px-8 py-3 bg-red-600 text-white font-bold rounded shadow-lg hover:bg-red-700 editable" contenteditable="true">Shop Now</button>
                    </div>
                `;
            }
        }

        // Settings Logic
        function changeBg(color) {
            const canvas = document.getElementById('canvas');
            canvas.className = "w-[400px] min-h-[500px] shadow-xl rounded-lg relative border border-gray-200 transition-all duration-200 p-6"; // reset
            
            if (color === 'black') canvas.classList.add('bg-gray-900', 'text-white');
            else if (color === 'indigo') canvas.classList.add('bg-indigo-600', 'text-white');
            else if (color === 'gradient') canvas.classList.add('bg-gradient-to-br', 'from-purple-500', 'to-pink-500', 'text-white');
            // white is default
        }

        // Preview Logic
        function togglePreview() {
            const modal = document.getElementById('previewModal');
            const contentDiv = document.getElementById('previewContent');
            const canvas = document.getElementById('canvas');
            
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                // Clone canvas content but remove contenteditable attributes for preview
                let html = canvas.innerHTML;
                html = html.replace(/contenteditable="true"/g, '');
                html = html.replace(/editable/g, ''); // remove helper classes
                
                // Add specific styles for preview based on current canvas classes
                let previewClasses = canvas.className.replace('w-[400px]', 'w-full').replace('min-h-[500px]', '');
                contentDiv.className = previewClasses + " relative shadow-2xl";
                contentDiv.innerHTML = html;
                
                // Re-bind close button in preview
                const closeBtn = contentDiv.querySelector('.fa-times').parentElement;
                closeBtn.onclick = togglePreview;

                modal.style.display = 'flex';
            }
        }

        // Export Logic
        function exportCode() {
            const canvas = document.getElementById('canvas');
            let html = canvas.innerHTML;
            
            // Clean up editor-specific stuff
            html = html.replace(/contenteditable="true"/g, '');
            html = html.replace(/editable/g, '');
            
            const code = `
<!-- Pop-up Maker Generated Code -->
<div id="my-custom-popup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
    <div style="position:relative; background:white; padding:2rem; border-radius:8px; max-width:400px; width:90%; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
        <span onclick="document.getElementById('my-custom-popup').style.display='none'" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px; color:#666;">&times;</span>
        ${html}
    </div>
</div>

<script>
    // Simple trigger: Show after 2 seconds
    setTimeout(() => {
        document.getElementById('my-custom-popup').style.display = 'flex';
    }, 2000);
<\/script>
            `.trim();

            document.getElementById('codeOutput').textContent = code;
            document.getElementById('codeModal').classList.remove('hidden');
        }

        function copyCode() {
            const code = document.getElementById('codeOutput').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Code copied to clipboard!');
            });
        }
    </script>
</body>
</html>
