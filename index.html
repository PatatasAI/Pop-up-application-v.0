<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopMaker Pro - SaaS Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        /* Canvas Grid */
        .canvas-bg {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Draggable Items */
        .draggable-item { cursor: grab; transition: all 0.2s; }
        .draggable-item:active { cursor: grabbing; }
        .draggable-item:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }

        /* Selected Element in Editor */
        .selected-element { outline: 2px solid #4f46e5; position: relative; }
        .selected-element::after {
            content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px dashed #4f46e5; pointer-events: none;
        }

        /* Preview Overlay */
        .preview-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999;
            justify-content: center; align-items: center;
        }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- ================= APP CONTAINER ================= -->
    <div id="app" class="flex-1 flex flex-col h-full overflow-hidden"></div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // --- 1. STATE MANAGEMENT & DATABASE SIMULATION ---
        const DB_KEY = 'popmaker_db_v1';
        
        const defaultData = {
            users: [
                { id: 'admin', email: 'admin@poptin.com', password: 'admin123', role: 'admin', companyName: 'PopMaker HQ', website: 'https://poptin.com' },
                { id: 'demo', email: 'demo@example.com', password: 'demo123', role: 'user', companyName: 'Demo Company', website: 'https://example.com' }
            ],
            popups: [
                { id: 'p1', userId: 'demo', name: 'Welcome Offer', type: 'popup', status: 'draft', position: 'center', width: '500px', height: 'auto', elements: [
                    { id: 'e1', type: 'heading', content: 'Welcome!', style: { fontSize: '24px', color: '#1f2937', textAlign: 'center' } },
                    { id: 'e2', type: 'text', content: 'Subscribe for exclusive deals.', style: { fontSize: '16px', color: '#4b5563', textAlign: 'center' } },
                    { id: 'e3', type: 'button', content: 'Get Started', style: { backgroundColor: '#4f46e5', color: '#ffffff', padding: '10px 20px', borderRadius: '6px' } }
                ]}
            ]
        };

        // Initialize DB
        function getDB() {
            const stored = localStorage.getItem(DB_KEY);
            if (!stored) {
                localStorage.setItem(DB_KEY, JSON.stringify(defaultData));
                return defaultData;
            }
            return JSON.parse(stored);
        }

        function saveDB(data) {
            localStorage.setItem(DB_KEY, JSON.stringify(data));
        }

        let currentUser = null;
        let currentPopup = null;
        let selectedElementId = null;
        let adminImpersonating = null; // Stores ID of user admin is viewing

        // --- 2. AUTHENTICATION ---
        function login(email, password) {
            const db = getDB();
            const user = db.users.find(u => u.email === email && u.password === password);
            if (user) {
                currentUser = user;
                adminImpersonating = null;
                renderApp();
                return true;
            }
            return false;
        }

        function signup(name, email, password, company, website) {
            const db = getDB();
            if (db.users.find(u => u.email === email)) return false;
            const newUser = {
                id: 'u_' + Date.now(),
                email, password, role: 'user',
                companyName: company || name,
                website: website || ''
            };
            db.users.push(newUser);
            saveDB(db);
            currentUser = newUser;
            renderApp();
            return true;
        }

        function logout() {
            currentUser = null;
            adminImpersonating = null;
            currentPopup = null;
            renderApp();
        }

        function impersonateUser(userId) {
            const db = getDB();
            const user = db.users.find(u => u.id === userId);
            if (user) {
                adminImpersonating = user.id;
                currentUser = user; // Switch context
                renderApp();
            }
        }

        function stopImpersonation() {
            adminImpersonating = null;
            currentUser = db.users.find(u => u.email === 'admin@poptin.com'); // Return to admin
            renderApp();
        }

        // --- 3. POPUP DATA HANDLING ---
        function createPopup(type, templateName) {
            const db = getDB();
            const newPopup = {
                id: 'p_' + Date.now(),
                userId: currentUser.id,
                name: `New ${type} ${db.popups.filter(p => p.userId === currentUser.id).length + 1}`,
                type: type, // 'popup', 'banner', 'ghl'
                status: 'draft',
                position: 'center',
                width: '500px',
                height: 'auto',
                bannerPosition: 'bottom', // for banners
                ghlEmbedCode: '', // for GHL
                elements: templateName ? getTemplateElements(templateName) : []
            };
            db.popups.push(newPopup);
            saveDB(db);
            openEditor(newPopup);
        }

        function savePopup(popupData) {
            const db = getDB();
            const index = db.popups.findIndex(p => p.id === popupData.id);
            if (index !== -1) {
                db.popups[index] = popupData;
                saveDB(db);
                // Show toast
                const toast = document.getElementById('save-toast');
                if(toast) {
                    toast.classList.remove('hidden');
                    setTimeout(() => toast.classList.add('hidden'), 2000);
                }
            }
        }

        function deletePopup(id) {
            if(!confirm('Are you sure?')) return;
            const db = getDB();
            db.popups = db.popups.filter(p => p.id !== id);
            saveDB(db);
            renderDashboard();
        }

        function getTemplateElements(name) {
            if (name === 'newsletter') return [
                { id: 't1', type: 'heading', content: 'Join Our Newsletter', style: { fontSize: '24px', fontWeight: 'bold', textAlign: 'center', color: '#111827' } },
                { id: 't2', type: 'text', content: 'Get the latest updates directly in your inbox.', style: { fontSize: '16px', textAlign: 'center', color: '#4b5563', marginTop: '8px' } },
                { id: 't3', type: 'input', placeholder: 'Enter email', style: { width: '100%', padding: '10px', marginTop: '16px', border: '1px solid #d1d5db', borderRadius: '4px' } },
                { id: 't4', type: 'button', content: 'Subscribe', style: { width: '100%', backgroundColor: '#2563eb', color: 'white', padding: '12px', marginTop: '12px', borderRadius: '4px', fontWeight: 'bold' } }
            ];
            if (name === 'discount') return [
                { id: 't1', type: 'heading', content: 'FLASH SALE', style: { fontSize: '32px', fontWeight: '900', textAlign: 'center', color: '#dc2626' } },
                { id: 't2', type: 'heading', content: '50% OFF', style: { fontSize: '48px', fontWeight: '900', textAlign: 'center', color: '#dc2626', lineHeight: '1' } },
                { id: 't3', type: 'button', content: 'Shop Now', style: { backgroundColor: '#000', color: 'white', padding: '15px 30px', marginTop: '20px', borderRadius: '0', textTransform: 'uppercase' } }
            ];
            return [];
        }

        // --- 4. VIEW RENDERERS ---

        function renderLandingPage() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">P</div>
                        <span class="text-xl font-bold text-gray-900">PopMaker Pro</span>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="showLogin()" class="text-gray-600 hover:text-indigo-600 font-medium">Log In</button>
                        <button onclick="showSignup()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Get Started</button>
                    </div>
                </nav>
                
                <main class="flex-1 overflow-y-auto">
                    <!-- Hero -->
                    <section class="py-20 px-6 text-center max-w-5xl mx-auto">
                        <h1 class="text-5xl font-extrabold text-gray-900 mb-6 leading-tight">
                            Create Powerful Popups <br/><span class="text-indigo-600">Without the Hassle</span>
                        </h1>
                        <p class="text-xl text-gray-600 mb-10 max-w-2xl mx-auto">
                            Build, customize, and manage high-converting website popups from one simple platform. No coding required.
                        </p>
                        <div class="flex justify-center gap-4">
                            <button onclick="handleDemo()" class="bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-lg hover:shadow-xl transition transform hover:-translate-y-1">
                                View Demo
                            </button>
                            <button onclick="showLogin()" class="bg-white text-gray-700 border border-gray-300 px-8 py-4 rounded-xl font-bold text-lg hover:bg-gray-50 transition">
                                Log In
                            </button>
                        </div>
                    </section>

                    <!-- Features -->
                    <section class="py-16 bg-white">
                        <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-3 gap-12">
                            <div class="text-center">
                                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl"><i class="fas fa-mouse-pointer"></i></div>
                                <h3 class="text-xl font-bold mb-3">Drag & Drop Editor</h3>
                                <p class="text-gray-600">Easily add headings, buttons, images, and forms with our intuitive visual editor.</p>
                            </div>
                            <div class="text-center">
                                <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl"><i class="fas fa-layer-group"></i></div>
                                <h3 class="text-xl font-bold mb-3">Multiple Types</h3>
                                <p class="text-gray-600">Create standard popups, top/bottom banners, or embed GoHighLevel forms instantly.</p>
                            </div>
                            <div class="text-center">
                                <div class="w-16 h-16 bg-green-100 text-green-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl"><i class="fas fa-chart-line"></i></div>
                                <h3 class="text-xl font-bold mb-3">Boost Conversions</h3>
                                <p class="text-gray-600">Use exit-intent triggers and professional templates to grow your email list.</p>
                            </div>
                        </div>
                    </section>
                </main>
                
                <footer class="bg-gray-900 text-gray-400 py-12 text-center">
                    <p>&copy; 2023 PopMaker Pro. All rights reserved.</p>
                </footer>
            `;
        }

        function showLogin() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
                        <div class="text-center mb-8">
                            <div class="w-12 h-12 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4">P</div>
                            <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
                            <p class="text-gray-500 mt-2">Sign in to your account</p>
                        </div>
                        <form onsubmit="event.preventDefault(); handleLoginSubmit();" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                                <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="you@company.com">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" id="login-pass" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">Sign In</button>
                        </form>
                        <div class="mt-6 text-center">
                            <p class="text-sm text-gray-600">Don't have an account? <button onclick="showSignup()" class="text-indigo-600 font-bold hover:underline">Sign up</button></p>
                            <p class="text-xs text-gray-400 mt-2"><button onclick="renderLandingPage()" class="hover:underline">← Back to Home</button></p>
                        </div>
                    </div>
                </div>
            `;
        }

        function showSignup() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
                        <div class="text-center mb-6">
                            <h2 class="text-2xl font-bold text-gray-900">Create Account</h2>
                            <p class="text-gray-500 mt-2">Start building popups today</p>
                        </div>
                        <form onsubmit="event.preventDefault(); handleSignupSubmit();" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                <input type="text" id="signup-name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
                                <input type="text" id="signup-company" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input type="email" id="signup-email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" id="signup-pass" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">Create Account</button>
                        </form>
                        <div class="mt-6 text-center">
                            <p class="text-sm text-gray-600">Already have an account? <button onclick="showLogin()" class="text-indigo-600 font-bold hover:underline">Log in</button></p>
                            <p class="text-xs text-gray-400 mt-2"><button onclick="renderLandingPage()" class="hover:underline">← Back to Home</button></p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            const db = getDB();
            // If admin is impersonating, show that user's data, otherwise current user's
            const viewUserId = adminImpersonating || currentUser.id;
            const userPopups = db.popups.filter(p => p.userId === viewUserId);
            
            const isImpersonating = adminImpersonating !== null && currentUser.role === 'admin';

            let dashboardContent = '';
            
            if (isImpersonating) {
                dashboardContent = `
                    <div class="bg-red-50 border-b border-red-200 p-4 flex justify-between items-center">
                        <div class="flex items-center gap-2 text-red-700 font-bold">
                            <i class="fas fa-user-shield"></i> Admin Mode: Viewing ${currentUser.companyName}
                        </div>
                        <button onclick="stopImpersonation()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 text-sm">Exit Admin Mode</button>
                    </div>
                `;
            }

            dashboardContent += `
                <div class="p-8 max-w-7xl mx-auto">
                    <div class="flex justify-between items-end mb-8">
                        <div>
                            <h1 class="text-3xl font-bold text-gray-900">Dashboard</h1>
                            <p class="text-gray-500 mt-1">Welcome back, ${currentUser.companyName}</p>
                        </div>
                        <button onclick="showCreateTypeSelection()" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-indigo-700 shadow-md flex items-center gap-2">
                            <i class="fas fa-plus"></i> Create New Popup
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium uppercase">Total Popups</p>
                            <p class="text-3xl font-bold text-gray-900 mt-2">${userPopups.length}</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium uppercase">Active</p>
                            <p class="text-3xl font-bold text-green-600 mt-2">${userPopups.filter(p => p.status === 'active').length}</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium uppercase">Drafts</p>
                            <p class="text-3xl font-bold text-yellow-600 mt-2">${userPopups.filter(p => p.status === 'draft').length}</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-sm text-gray-500 font-medium uppercase">Website</p>
                            <p class="text-lg font-bold text-indigo-600 mt-2 truncate">${currentUser.website || 'Not set'}</p>
                        </div>
                    </div>

                    <h2 class="text-xl font-bold text-gray-800 mb-4">Recent Popups</h2>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Name</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Type</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Status</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Last Updated</th>
                                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${userPopups.length === 0 ? '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No popups created yet.</td></tr>' : ''}
                                ${userPopups.map(p => `
                                    <tr class="hover:bg-gray-50 transition">
                                        <td class="px-6 py-4 font-medium text-gray-900">${p.name}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs font-bold uppercase">${p.type}</span>
                                        </td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 ${p.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'} rounded text-xs font-bold uppercase">${p.status}</span>
                                        </td>
                                        <td class="px-6 py-4 text-gray-500 text-sm">Just now</td>
                                        <td class="px-6 py-4 text-right space-x-2">
                                            <button onclick='openEditorById("${p.id}")' class="text-indigo-600 hover:text-indigo-900 font-medium text-sm">Edit</button>
                                            <button onclick="deletePopup('${p.id}')" class="text-red-500 hover:text-red-700 font-medium text-sm">Delete</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            const app = document.getElementById('app');
            app.innerHTML = `
                <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-40">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center text-white font-bold">P</div>
                        <span class="font-bold text-gray-800">PopMaker Pro</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-right hidden md:block">
                            <p class="text-sm font-bold text-gray-900">${currentUser.companyName}</p>
                            <p class="text-xs text-gray-500">${currentUser.email}</p>
                        </div>
                        <button onclick="logout()" class="text-gray-500 hover:text-red-600"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </nav>
                <div class="flex-1 overflow-y-auto bg-gray-50">
                    ${dashboardContent}
                </div>
            `;
        }

        function renderAdminDashboard() {
            const db = getDB();
            const users = db.users.filter(u => u.role === 'user');
            
            const app = document.getElementById('app');
            app.innerHTML = `
                <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex justify-between items-center">
                    <div class="flex items-center gap-2 text-white">
                        <i class="fas fa-shield-alt text-indigo-400"></i>
                        <span class="font-bold text-lg">Admin Dashboard</span>
                    </div>
                    <button onclick="logout()" class="text-gray-400 hover:text-white">Logout</button>
                </nav>
                <div class="flex-1 overflow-y-auto bg-gray-100 p-8">
                    <div class="max-w-6xl mx-auto">
                        <h1 class="text-3xl font-bold text-gray-900 mb-6">User Management</h1>
                        
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Company / User</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Email</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Website</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase">Popups</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    ${users.map(u => {
                                        const count = db.popups.filter(p => p.userId === u.id).length;
                                        return `
                                        <tr class="hover:bg-gray-50">
                                            <td class="px-6 py-4">
                                                <p class="font-bold text-gray-900">${u.companyName}</p>
                                                <p class="text-xs text-gray-500">ID: ${u.id}</p>
                                            </td>
                                            <td class="px-6 py-4 text-gray-600">${u.email}</td>

        function renderElements() {
            if (!currentPopup.elements) return '';
            return currentPopup.elements.map(el => {
                const isSelected = el.id === selectedElementId ? 'selected-element' : '';
                let contentHtml = '';
                
                if (el.type === 'heading') contentHtml = `<h2 style="font-size:${el.style.fontSize}; color:${el.style.color}; text-align:${el.style.textAlign}; font-weight:${el.style.fontWeight||'bold'}">${el.content}</h2>`;
                else if (el.type === 'text') contentHtml = `<p style="font-size:${el.style.fontSize}; color:${el.style.color}; text-align:${el.style.textAlign}; margin-top:${el.style.marginTop||0}">${el.content}</p>`;
                else if (el.type === 'button') contentHtml = `<button style="background-color:${el.style.backgroundColor}; color:${el.style.color}; padding:${el.style.padding}; border-radius:${el.style.borderRadius}; width:${el.style.width||'auto'}; font-weight:bold; border:none; cursor:pointer;">${el.content}</button>`;
                else if (el.type === 'image') contentHtml = `<div style="width:${el.style.width||'100%'}; height:150px; background:#eee; display:flex; align-items:center; justify-content:center; color:#999;"><i class="fas fa-image text-2xl"></i></div>`;
                else if (el.type === 'input') contentHtml = `<input type="text" placeholder="${el.placeholder}" style="width:${el.style.width||'100%'}; padding:${el.style.padding}; border:${el.style.border}; border-radius:${el.style.borderRadius}; margin-top:${el.style.marginTop||0}" disabled>`;
                else if (el.type === 'video') contentHtml = `<div style="width:100%; height:200px; background:#000; display:flex; align-items:center; justify-content:center; color:white;"><i class="fas fa-play-circle text-3xl"></i></div>`;
                else if (el.type === 'divider') contentHtml = `<hr style="border:0; border-top:1px solid #ddd; margin:10px 0;">`;

                return `
                    <div class="relative group mb-2 ${isSelected}" onclick="selectElement('${el.id}')" draggable="true" ondragstart="dragExisting(event, '${el.id}')">
                        ${contentHtml}
                        ${isSelected ? `<button onclick="deleteElement('${el.id}')" class="absolute -top-2 -right-2 bg-red-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs shadow hover:bg-red-600"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderCanvasProperties() {
            return `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Popup Width</label>
                        <input type="text" value="${currentPopup.width}" onchange="updateCanvasSetting('width', this.value)" class="w-full border border-gray-300 rounded p-2 text-sm">

                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Popup Height</label>
                        <input type="text" value="${currentPopup.height}" onchange="updateCanvasSetting('height', this.value)" class="w-full border border-gray-300 rounded p-2 text-sm">

                    </div>
                    
                    ${currentPopup.type === 'popup' ? `
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Position</label>
                        <select onchange="updateCanvasSetting('position', this.value)" class="w-full border border-gray-300 rounded p-2 text-sm">
                            <option value="center" ${currentPopup.position === 'center' ? 'selected' : ''}>Center Screen</option>
                            <option value="top-left" ${currentPopup.position === 'top-left' ? 'selected' : ''}>Top Left</option>
                            <option value="top-right" ${currentPopup.position === 'top-right' ? 'selected' : ''}>Top Right</option>
                            <option value="bottom-left" ${currentPopup.position === 'bottom-left' ? 'selected' : ''}>Bottom Left</option>
                            <option value="bottom-right" ${currentPopup.position === 'bottom-right' ? 'selected' : ''}>Bottom Right</option>
                        </select>
                    </div>
                    ` : ''}

                    ${currentPopup.type === 'banner' ? `
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Banner Position</label>
                        <select onchange="updateCanvasSetting('bannerPosition', this.value)" class="w-full border border-gray-300 rounded p-2 text-sm">
                            <option value="top" ${currentPopup.bannerPosition === 'top' ? 'selected' : ''}>Top of Page</option>
                            <option value="bottom" ${currentPopup.bannerPosition === 'bottom' ? 'selected' : ''}>Bottom of Page</option>
                        </select>
                    </div>
                    ` : ''}
                    
                    <div class="pt-4 border-t border-gray-200">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Status</label>
                        <select onchange="updateCanvasSetting('status', this.value)" class="w-full border border-gray-300 rounded p-2 text-sm">

        function renderElementProperties() {
            const el = currentPopup.elements.find(e => e.id === selectedElementId);
            if (!el) return '';

            return `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Content / Text</label>
                        <textarea onchange="updateElementStyle('content', this.value)" class="w-full border border-gray-300 rounded p-2 text-sm h-20">${el.content || el.placeholder || ''}</textarea>
                    </div>
                    
                    ${el.type !== 'image' && el.type !== 'divider' && el.type !== 'video' ? `
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Font Size</label>
                        <input type="text" value="${el.style.fontSize || '16px'}" onchange="updateElementStyle('fontSize', this.value)" class="w-full border border-gray-300 rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Text Color</label>
                        <input type="color" value="${el.style.color || '#000000'}" onchange="updateElementStyle('color', this.value)" class="w-full h-8 border border-gray-300 rounded p-1">
                    </div>
                    ` : ''}

                    ${el.type === 'button' ? `
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Bg Color</label>
                        <input type="color" value="${el.style.backgroundColor || '#4f46e5'}" onchange="updateElementStyle('backgroundColor', this.value)" class="w-full h-8 border border-gray-300 rounded p-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Padding</label>
                        <input type="text" value="${el.style.padding || '10px 20px'}" onchange="updateElementStyle('padding', this.value)" class="w-full border border-gray-300 rounded p-2 text-sm">
                    </div>
                    ` : ''}
                    
                    <div class="pt-4 border-t border-gray-200">
                         <button onclick="deleteElement('${el.id}')" class="w-full bg-red-50 text-red-600 border border-red-200 py-2 rounded text-xs font-bold hover:bg-red-100">Delete Element</button>
                    </div>
                </div>
            `;
        }

        // --- 5. EDITOR ACTIONS ---

        function allowDrop(ev) { ev.preventDefault(); }

        function drag(ev) {
            ev.dataTransfer.setData("type", ev.target.dataset.type);
            ev.dataTransfer.setData("isNew", "true");
        }

        function dragExisting(ev, id) {
            ev.dataTransfer.setData("id", id);
            ev.dataTransfer.setData("isNew", "false");
            ev.stopPropagation(); // Prevent triggering drop on parent
        }

        function drop(ev) {
            ev.preventDefault();
            const isNew = ev.dataTransfer.getData("isNew") === "true";
            const container = document.getElementById('elements-container');
            
            if (isNew) {
                const type = ev.dataTransfer.getData("type");
                const newEl = {
                    id: 'el_' + Date.now(),
                    type: type,
                    content: type === 'heading' ? 'New Heading' : (type === 'button' ? 'Click Me' : (type === 'text' ? 'Lorem ipsum dolor sit amet.' : '')),
                    placeholder: type === 'input' ? 'Enter text...' : '',
                    style: getDefaultStyle(type)
                };
                currentPopup.elements.push(newEl);
                selectedElementId = newEl.id;
            } else {
                // Moving existing element (simplified: just re-render for now, real DnD reorder needs more logic)
                const id = ev.dataTransfer.getData("id");
                selectedElementId = id;
            }
            renderEditor();
        }

        function getDefaultStyle(type) {
            switch(type) {
                case 'heading': return { fontSize: '24px', color: '#111827', textAlign: 'center', fontWeight: 'bold' };
                case 'text': return { fontSize: '16px', color: '#4b5563', textAlign: 'center', marginTop: '8px' };
                case 'button': return { backgroundColor: '#4f46e5', color: '#ffffff', padding: '12px 24px', borderRadius: '6px', width: 'auto' };
                case 'input': return { width: '100%', padding: '10px', border: '1px solid #d1d5db', borderRadius: '4px', marginTop: '10px' };
                default: return {};
            }
        }

        function selectElement(id) {
            selectedElementId = id;
            renderEditor();
        }

        function deleteElement(id) {
            currentPopup.elements = currentPopup.elements.filter(e => e.id !== id);
            selectedElementId = null;
            renderEditor();
        }

        function updateElementStyle(key, value) {
            const el = currentPopup.elements.find(e => e.id === selectedElementId);
            if (el) {
                if (key === 'content') el.content = value;
                else if (key === 'placeholder') el.placeholder = value;
                else el.style[key] = value;
                renderEditor(); // Re-render to show changes
            }
        }
        
        function updateGHLCode() {
            const code = document.getElementById('ghl-code').value;
            currentPopup.ghlEmbedCode = code;
            // Add a special element to represent the form if not exists
            if (!currentPopup.elements.find(e => e.type === 'ghl-form')) {
                currentPopup.elements.push({
                    id: 'ghl_' + Date.now(),
                    type: 'ghl-form',
                    content: code,
                    style: {}
                });
            } else {
                const formEl = currentPopup.elements.find(e => e.type === 'ghl-form');
                formEl.content = code;
            }
            alert("GHL Code Updated & Saved to Element");
            renderEditor();
        }

        function updateCanvasSetting(key, value) {
            currentPopup[key] = value;
            renderEditor();
        }

        function saveCurrentPopup() {
            saveDB(getDB()); // Ensure DB ref is fresh
            savePopup(currentPopup);
        }

        function togglePreview() {
            saveCurrentPopup(); // Save before preview
            
            const overlay = document.createElement('div');
            overlay.id = 'preview-overlay';
            overlay.className = 'preview-overlay';
            overlay.style.display = 'flex';
            
            // Calculate position styles
            let posStyles = "";
            if (currentPopup.type === 'popup') {
                if (currentPopup.position === 'top-left') posStyles = "top: 20px; left: 20px; right: auto; bottom: auto;";
                else if (currentPopup.position === 'top-right') posStyles = "top: 20px; right: 20px; left: auto; bottom: auto;";
                else if (currentPopup.position === 'bottom-left') posStyles = "bottom: 20px; left: 20px; right: auto; top: auto;";
                else if (currentPopup.position === 'bottom-right') posStyles = "bottom: 20px; right: 20px; left: auto; top: auto;";
                else posStyles = ""; // Center is default flex
            } else if (currentPopup.type === 'banner') {
                posStyles = currentPopup.bannerPosition === 'top' ? "top:0; left:0; right:0; width:100%; border-radius:0;" : "bottom:0; left:0; right:0; width:100%; border-radius:0;";
            }

            // Generate Inner HTML
            let innerHTML = '';
            if (currentPopup.type === 'ghl' && currentPopup.ghlEmbedCode) {
                innerHTML = currentPopup.ghlEmbedCode;
            } else {
                innerHTML = currentPopup.elements.map(el => {
                    let html = '';
                    if (el.type === 'heading') html = `<h2 style="font-size:${el.style.fontSize}; color:${el.style.color}; text-align:${el.style.textAlign}; margin:0">${el.content}</h2>`;
                    else if (el.type === 'text') html = `<p style="font-size:${el.style.fontSize}; color:${el.style.color}; text-align:${el.style.textAlign}; margin:10px 0">${el.content}</p>`;
                    else if (el.type === 'button') html = `<button style="background:${el.style.backgroundColor}; color:${el.style.color}; padding:${el.style.padding}; border:none; border-radius:${el.style.borderRadius}; cursor:pointer; font-weight:bold;">${el.content}</button>`;
                    else if (el.type === 'input') html = `<input type="text" placeholder="${el.placeholder}" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:4px;" />`;
                    else if (el.type === 'ghl-form') html = el.content;
                    else if (el.type === 'image') html = `<div style="width:100%; height:150px; background:#eee; margin:10px 0; display:flex; align-items:center; justify-content:center; color:#999;">Image Placeholder</div>`;
                    else if (el.type === 'video') html = `<div style="width:100%; height:200px; background:#000; margin:10px 0; display:flex; align-items:center; justify-content:center; color:white;">Video Placeholder</div>`;
                    else if (el.type === 'divider') html = `<hr style="border:0; border-top:1px solid #ddd; margin:15px 0;">`;
                    return html;
                }).join('');
            }

            // Close button logic
            const closeBtn = `<span onclick="this.parentElement.parentElement.style.display='none'" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px; color:#999;">&times;</span>`;

            let popupStyle = `background:white; padding:2rem; border-radius:8px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1); position:relative; max-width:100%;`;
            if (currentPopup.type === 'popup') popupStyle += ` width: ${currentPopup.width}; min-height: ${currentPopup.height};`;
            
            // Handle Center alignment specifically for flex container
            const centerClass = (currentPopup.type === 'popup' && currentPopup.position === 'center') ? '' : 'style="align-items:flex-start;' + (currentPopup.type === 'banner' ? ' padding:0;' : '') + '"';

            overlay.innerHTML = `
                <div class="relative w-full h-full" ${centerClass}>
                    <div style="${popupStyle} ${posStyles}">
                        ${closeBtn}
                        ${innerHTML}
                    </div>
                </div>
            `;
            
            overlay.onclick = (e) => { if(e.target === overlay || e.target.classList.contains('relative')) overlay.remove(); };
            document.body.appendChild(overlay);
        }

        // --- 6. INITIALIZATION & HELPERS ---

        function handleLoginSubmit() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            if (login(email, pass)) {
                // Redirect handled by renderApp
            } else {
                alert('Invalid credentials. Try admin@poptin.com / admin123');
            }
        }

        function handleSignupSubmit() {
            const name = document.getElementById('signup-name').value;
            const company = document.getElementById('signup-company').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-pass').value;
            
            if (signup(name, email, pass, company)) {
                // Success
            } else {
                alert('Email already exists.');
            }
        }

        function handleDemo() {
            login('demo@example.com', 'demo123');
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!currentUser) {
                renderLandingPage();
            } else if (currentUser.role === 'admin' && !adminImpersonating) {
                renderAdminDashboard();
            } else {
                renderDashboard();
            }
        }

        // Start App
        renderApp();

    </script>
