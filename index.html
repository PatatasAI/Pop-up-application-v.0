<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopMaker Pro - Create Powerful Popups</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        
        /* Smooth Scrolling */
        html { scroll-behavior: smooth; }

        /* Custom Animations */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Editor Specific Styles */
        .canvas-area { background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        .draggable-item { cursor: grab; user-select: none; }
        .draggable-item:active { cursor: grabbing; }
        
        /* Element Selection */
        .selected-element { outline: 2px solid #4f46e5; position: relative; }
        .selected-element::after {
            content: ''; position: absolute; inset: -4px; border: 1px dashed #4f46e5; pointer-events: none;
        }
        .resize-handle {
            width: 10px; height: 10px; background: white; border: 2px solid #4f46e5;
            position: absolute; z-index: 10; display: none;
        }
        .selected-element .resize-handle { display: block; }
        .rh-tl { top: -5px; left: -5px; cursor: nw-resize; }
        .rh-tr { top: -5px; right: -5px; cursor: ne-resize; }
        .rh-bl { bottom: -5px; left: -5px; cursor: sw-resize; }
        .rh-br { bottom: -5px; right: -5px; cursor: se-resize; }

        /* Popup Container Selection */
        .popup-container-selected { outline: 2px solid #10b981; outline-offset: 2px; }

        /* Preview Overlay */
        .preview-overlay { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            z-index: 9999; justify-content: center; align-items: center; 
            backdrop-filter: blur(2px);
        }
        .preview-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #1f2937; color: white; padding: 8px 16px; border-radius: 20px;
            display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10001; font-size: 14px;
        }

        /* Template Cards */
        .template-card { transition: all 0.3s ease; }
        .template-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }

        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased overflow-x-hidden">

    <!-- Navigation -->
    <nav class="fixed w-full bg-white/90 backdrop-blur-md border-b border-gray-100 z-50 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer" onclick="app.nav.home()">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-200">P</div>
                    <span class="font-bold text-xl tracking-tight text-gray-900">PopMaker<span class="text-indigo-600">Pro</span></span>
                </div>
                
                <!-- Public Nav -->
                <div class="hidden md:flex items-center space-x-8" id="public-nav">
                    <a href="#features" class="text-gray-600 hover:text-indigo-600 font-medium transition">Features</a>
                    <a href="#templates" class="text-gray-600 hover:text-indigo-600 font-medium transition">Templates</a>
                    <a href="#how-it-works" class="text-gray-600 hover:text-indigo-600 font-medium transition">How It Works</a>
                    <button onclick="app.auth.showLogin()" class="text-gray-600 hover:text-indigo-600 font-medium transition">Log In</button>
                    <button onclick="app.auth.showSignup()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-full font-medium hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 transform hover:-translate-y-0.5">Get Started</button>
                </div>

                <!-- Logged In Nav -->
                <div class="hidden items-center space-x-4" id="user-nav">
                    <div class="flex items-center gap-3 px-3 py-1.5 bg-gray-50 rounded-full border border-gray-200">
                        <div class="w-6 h-6 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-xs font-bold" id="nav-avatar">U</div>
                        <span class="text-sm font-medium text-gray-700" id="nav-username">User</span>
                    </div>
                    <button onclick="app.router.navigate('settings')" class="text-gray-500 hover:text-indigo-600"><i class="fas fa-cog"></i></button>
                    <button onclick="app.auth.logout()" class="text-gray-500 hover:text-red-600 font-medium text-sm">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-container" class="pt-16 min-h-screen">
        <!-- Views injected here by JS -->
    </main>

    <!-- Templates & Data (Hidden) -->
    <script>
        // --- DATA & CONFIG ---
        const DB_KEYS = { USERS: 'pm_users', POPUPS: 'pm_popups', SESSION: 'pm_session' };
        
        const TEMPLATES = [

            { id: 't2', name: 'Discount', type: 'popup', category: 'Sales', color: 'bg-red-50', preview: '<div class="p-6 text-center"><h3 class="text-2xl font-extrabold text-red-600 mb-1">50% OFF</h3><p class="text-xs text-gray-500 uppercase tracking-wide mb-4">Flash Sale</p><div class="h-10 bg-red-600 rounded w-full text-white text-xs flex items-center justify-center">Shop Now</div></div>' },
            { id: 't3', name: 'Welcome', type: 'popup', category: 'General', color: 'bg-green-50', preview: '<div class="p-6 text-center"><h3 class="text-xl font-bold text-green-800 mb-2">Welcome!</h3><p class="text-sm text-gray-600 mb-4">Thanks for visiting our store.</p><div class="h-8 bg-green-600 rounded w-full"></div></div>' },
            { id: 't4', name: 'Contact Us', type: 'popup', category: 'Contact', color: 'bg-gray-50', preview: '<div class="p-6"><h3 class="text-lg font-bold mb-4">Contact Us</h3><div class="space-y-2"><div class="h-8 bg-gray-200 rounded"></div><div class="h-8 bg-gray-200 rounded"></div><div class="h-8 bg-indigo-600 rounded mt-2"></div></div></div>' },
            { id: 't5', name: 'Event', type: 'popup', category: 'Event', color: 'bg-purple-50', preview: '<div class="p-6 text-center"><h3 class="text-xl font-bold text-purple-800">Webinar Invite</h3><p class="text-xs text-purple-600 mb-4">Oct 24 • 2PM EST</p><div class="h-8 bg-purple-600 rounded w-full text-white text-xs flex items-center justify-center">Register</div></div>' },
            { id: 't6', name: 'Exit Intent', type: 'popup', category: 'Retention', color: 'bg-orange-50', preview: '<div class="p-6 text-center"><h3 class="text-lg font-bold">Wait!</h3><p class="text-sm text-gray-600 mb-4">Don\'t leave empty handed.</p><div class="h-8 bg-orange-500 rounded w-full text-white text-xs flex items-center justify-center">Grab Offer</div></div>' },
            { id: 't7', name: 'Top Banner', type: 'banner', category: 'Banner', color: 'bg-gray-900', preview: '<div class="h-12 flex items-center justify-between px-6 text-white"><span class="text-sm font-medium">Free Shipping on Orders $50+</span><button class="text-xs underline">Dismiss</button></div>' },
            { id: 't8', name: 'Bottom Bar', type: 'banner', category: 'Banner', color: 'bg-indigo-600', preview: '<div class="h-14 flex items-center justify-between px-6 text-white"><div class="flex items-center gap-3"><i class="fas fa-star text-yellow-400"></i><span class="text-sm font-medium">Rated 4.9/5 by Customers</span></div><button class="bg-white text-indigo-600 px-3 py-1 rounded text-xs font-bold">Learn More</button></div>' },
            { id: 't9', name: 'Coupon', type: 'popup', category: 'Sales', color: 'bg-pink-50', preview: '<div class="p-6 text-center border-2 border-dashed border-pink-300 rounded-lg"><h3 class="text-xl font-bold text-pink-600">YOUR CODE</h3><div class="text-2xl font-mono font-bold my-2 bg-white py-1 px-3 rounded inline-block">SAVE20</div><p class="text-xs text-gray-500">At checkout</p></div>' },
            { id: 't10', name: 'Video Promo', type: 'popup', category: 'Media', color: 'bg-gray-800', preview: '<div class="p-1"><div class="aspect-video bg-black rounded flex items-center justify-center text-white"><i class="fas fa-play-circle text-4xl"></i></div><div class="p-4 text-center"><h4 class="font-bold">Watch Demo</h4></div></div>' },
            { id: 't11', name: 'Survey', type: 'popup', category: 'Feedback', color: 'bg-teal-50', preview: '<div class="p-6"><h3 class="font-bold mb-3">Quick Question</h3><div class="space-y-2"><div class="h-4 bg-white border rounded w-full"></div><div class="h-4 bg-white border rounded w-full"></div><button class="w-full bg-teal-600 h-8 rounded text-white text-xs mt-2">Submit</button></div></div>' },
            { id: 't12', name: 'Social', type: 'popup', category: 'Social', color: 'bg-blue-50', preview: '<div class="p-6 text-center"><h3 class="font-bold mb-4">Follow Us</h3><div class="flex justify-center gap-3"><div class="w-8 h-8 bg-blue-600 rounded-full"></div><div class="w-8 h-8 bg-pink-500 rounded-full"></div><div class="w-8 h-8 bg-sky-400 rounded-full"></div></div></div>' },
            { id: 't13', name: 'App Download', type: 'popup', category: 'Mobile', color: 'bg-gray-900', preview: '<div class="p-6 flex items-center gap-4 text-white"><div class="w-12 h-12 bg-gray-700 rounded-lg"></div><div><h4 class="font-bold text-sm">Get the App</h4><p class="text-xs text-gray-400">iOS & Android</p></div></div>' },
            { id: 't14', name: 'Black Friday', type: 'popup', category: 'Sales', color: 'bg-black', preview: '<div class="p-8 text-center text-white"><h2 class="text-3xl font-black italic mb-2">BLACK FRIDAY</h2><p class="text-red-500 font-bold mb-4">UP TO 80% OFF</p><button class="bg-white text-black px-6 py-2 font-bold uppercase">Shop Sale</button></div>' },
            { id: 't15', name: 'Quiz', type: 'popup', category: 'Engagement', color: 'bg-yellow-50', preview: '<div class="p-6 text-center"><h3 class="font-bold text-lg">Find Your Match</h3><p class="text-sm text-gray-600 mb-4">Take our 30s quiz</p><button class="bg-yellow-400 text-white px-6 py-2 rounded-full font-bold shadow-lg">Start Quiz</button></div>' },
            { id: 't16', name: 'Booking', type: 'popup', category: 'Service', color: 'bg-indigo-50', preview: '<div class="p-6"><h3 class="font-bold mb-2">Book Consultation</h3><p class="text-xs text-gray-500 mb-4">Free 15-min call</p><div class="h-8 bg-indigo-600 rounded text-white text-xs flex items-center justify-center">Select Time</div></div>' },
            { id: 't17', name: 'Announcement', type: 'popup', category: 'General', color: 'bg-white', preview: '<div class="p-6 border-l-4 border-indigo-500"><h3 class="font-bold">System Maintenance</h3><p class="text-sm text-gray-600 mt-1">Scheduled for Sunday 2AM.</p></div>' },
            { id: 't18', name: 'Free Gift', type: 'popup', category: 'Sales', color: 'bg-red-50', preview: '<div class="p-6 text-center"><div class="text-4xl mb-2">🎁</div><h3 class="font-bold text-red-600">Free Gift Inside</h3><p class="text-xs text-gray-500">With every order today</p></div>' },
            { id: 't19', name: 'Spin Wheel', type: 'popup', category: 'Gamification', color: 'bg-purple-50', preview: '<div class="p-6 text-center"><div class="w-24 h-24 bg-gradient-to-tr from-purple-500 to-pink-500 rounded-full mx-auto mb-3 flex items-center justify-center text-white font-bold">SPIN</div><p class="text-sm font-bold">Win up to 50% Off</p></div>' },
            { id: 't20', name: 'Minimalist', type: 'popup', category: 'Design', color: 'bg-gray-50', preview: '<div class="p-8 text-center"><h3 class="text-lg font-light tracking-widest uppercase mb-6">Subscribe</h3><div class="border-b border-gray-300 pb-2 text-sm">email@example.com</div></div>' }
        ];

        // --- STATE MANAGEMENT ---
        const state = {
            view: 'landing',
            user: null,
            currentPopup: null,
            selectedElementId: null,
            isDemo: false,
            demoData: null
        };

        // --- CORE APPLICATION LOGIC ---
        const app = {
            init: () => {
                app.auth.checkSession();
                app.router.navigate('landing');
            },

            // --- AUTHENTICATION ---
            auth: {
                checkSession: () => {
                    const session = localStorage.getItem(DB_KEYS.SESSION);
                    if (session) {
                        state.user = JSON.parse(session);
                        state.isDemo = state.user.email === 'demo@popmaker.local';
                        app.ui.updateNav();
                        if(state.view === 'landing') app.router.navigate('dashboard');
                    }
                },
                login: (email, password) => {
                    const users = JSON.parse(localStorage.getItem(DB_KEYS.USERS) || '[]');
                    // Admin Check
                    if (email === 'admin@poptin.com' && password === 'admin123') {
                        state.user = { name: 'Admin', email: 'admin@poptin.com', role: 'admin', company: 'PopMaker HQ' };
                        localStorage.setItem(DB_KEYS.SESSION, JSON.stringify(state.user));
                        app.ui.updateNav();
                        app.router.navigate('admin-dashboard');
                        return true;
                    }
                    // User Check
                    const user = users.find(u => u.email === email && u.password === password);
                    if (user) {
                        state.user = user;
                        state.isDemo = false;
                        localStorage.setItem(DB_KEYS.SESSION, JSON.stringify(user));
                        app.ui.updateNav();
                        app.router.navigate('dashboard');
                        return true;
                    }
                    alert('Invalid credentials. Please try again.');
                    return false;
                },
                signup: (name, company, email, password, website) => {
                    const users = JSON.parse(localStorage.getItem(DB_KEYS.USERS) || '[]');
                    if (users.find(u => u.email === email)) {
                        alert('Email already registered.');
                        return false;
                    }
                    const newUser = { id: Date.now().toString(), name, company, email, password, website, role: 'user', joined: new Date().toISOString() };
                    users.push(newUser);
                    localStorage.setItem(DB_KEYS.USERS, JSON.stringify(users));
                    
                    // Transfer Demo Data if applicable
                    if (state.isDemo && state.demoData) {
                        const popups = JSON.parse(localStorage.getItem(DB_KEYS.POPUPS) || '[]');
                        state.demoData.forEach(p => {
                            p.userId = newUser.id;
                            p.id = Date.now().toString() + Math.random();
                            popups.push(p);
                        });
                        localStorage.setItem(DB_KEYS.POPUPS, JSON.stringify(popups));
                        state.demoData = null;
                    }

                    state.user = newUser;
                    state.isDemo = false;
                    localStorage.setItem(DB_KEYS.SESSION, JSON.stringify(newUser));
                    app.ui.updateNav();
                    app.router.navigate('dashboard');
                    return true;
                },
                logout: () => {
                    localStorage.removeItem(DB_KEYS.SESSION);
                    state.user = null;
                    state.isDemo = false;
                    state.demoData = null;
                    app.ui.updateNav();
                    app.router.navigate('landing');
                },
                showLogin: () => app.ui.renderModal('login'),
                showSignup: () => app.ui.renderModal('signup')
            },

            // --- ROUTING & VIEWS ---
            router: {
                navigate: (viewName, params = null) => {
                    state.view = viewName;
                    const container = document.getElementById('app-container');
                    window.scrollTo(0,0);
                    
                    switch(viewName) {
                        case 'landing': app.views.landing(container); break;
                        case 'dashboard': app.views.dashboard(container); break;
                        case 'editor': app.views.editor(container, params); break;
                        case 'admin-dashboard': app.views.adminDashboard(container); break;
                        case 'settings': app.views.settings(container); break;
                        default: app.views.landing(container);
                    }
                }
            },

            // --- UI RENDERERS ---
            ui: {
                updateNav: () => {
                    const publicNav = document.getElementById('public-nav');
                    const userNav = document.getElementById('user-nav');
                    if (state.user) {
                        publicNav.classList.add('hidden');
                        userNav.classList.remove('hidden');
                        userNav.classList.add('flex');
                        document.getElementById('nav-username').textContent = state.user.name || 'User';
                        document.getElementById('nav-avatar').textContent = (state.user.name || 'U')[0].toUpperCase();
                    } else {
                        publicNav.classList.remove('hidden');
                        userNav.classList.add('hidden');
                        userNav.classList.remove('flex');
                    }
                },
                renderModal: (type) => {
                    const modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 fade-in';
                    modal.id = 'auth-modal';
                    
                    if (type === 'login') {
                        modal.innerHTML = `
                            <div class="bg-white rounded-2xl w-full max-w-md p-8 shadow-2xl relative">
                                <button onclick="document.getElementById('auth-modal').remove()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                                <h2 class="text-2xl font-bold mb-2">Welcome Back</h2>
                                <p class="text-gray-500 mb-6">Enter your details to access your account.</p>
                                <form onsubmit="event.preventDefault(); app.auth.login(this.email.value, this.password.value)" class="space-y-4">
                                    <input type="email" name="email" placeholder="Email" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                                    <input type="password" name="password" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">Log In</button>
                                </form>
                                <p class="mt-4 text-center text-sm text-gray-500">Don't have an account? <button onclick="document.getElementById('auth-modal').remove(); app.auth.showSignup()" class="text-indigo-600 font-bold hover:underline">Sign Up</button></p>
                            </div>`;
                    } else if (type === 'signup') {
                        modal.innerHTML = `
                            <div class="bg-white rounded-2xl w-full max-w-md p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <button onclick="document.getElementById('auth-modal').remove()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                                <h2 class="text-2xl font-bold mb-2">Create Account</h2>
                                <p class="text-gray-500 mb-6">Start building popups today.</p>
                                <form onsubmit="event.preventDefault(); app.auth.signup(this.name.value, this.company.value, this.email.value, this.password.value, this.website.value)" class="space-y-3">
                                    <input type="text" name="name" placeholder="Full Name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                                    <input type="text" name="company" placeholder="Company Name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                                    <input type="email" name="email" placeholder="Email Address" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                                    <input type="text" name="website" placeholder="Website URL (optional)" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                    <input type="password" name="password" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition mt-2">Create Account</button>
                                </form>
                                <p class="mt-4 text-center text-sm text-gray-500">Already have an account? <button onclick="document.getElementById('auth-modal').remove(); app.auth.showLogin()" class="text-indigo-600 font-bold hover:underline">Log In</button></p>
                            </div>`;
                    }
                    document.body.appendChild(modal);
                }
            },

            // --- VIEWS ---
            views: {
                landing: (container) => {
                    container.innerHTML = `
                        <!-- Hero -->
                        <section class="relative pt-20 pb-32 overflow-hidden">
                            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
                                <span class="inline-block py-1 px-3 rounded-full bg-indigo-50 text-indigo-600 text-sm font-semibold mb-6 animate-bounce">v2.0 Stable Release</span>
                                <h1 class="text-5xl md:text-7xl font-extrabold text-gray-900 tracking-tight mb-8 slide-up">
                                    Create Powerful Popups <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Without The Hassle</span>
                                </h1>
                                <p class="text-xl text-gray-500 max-w-2xl mx-auto mb-10 slide-up" style="animation-delay: 0.1s">
                                    Build, customize, and manage high-converting website popups from one simple platform. No coding required.
                                </p>
                                <div class="flex justify-center gap-4 slide-up" style="animation-delay: 0.2s">
                                    <button onclick="app.auth.showSignup()" class="bg-indigo-600 text-white px-8 py-4 rounded-full font-bold text-lg hover:bg-indigo-700 transition shadow-xl shadow-indigo-200 transform hover:-translate-y-1">Get Started Free</button>
                                    <button onclick="app.auth.login('demo@popmaker.local', 'demo')" class="bg-white text-gray-700 border border-gray-200 px-8 py-4 rounded-full font-bold text-lg hover:bg-gray-50 transition shadow-lg">View Demo</button>
                                </div>
                            </div>
                            
                            <!-- Dashboard Animation Preview -->
                            <div class="mt-20 max-w-5xl mx-auto px-4 relative">
                                <div class="bg-gray-900 rounded-xl shadow-2xl overflow-hidden border border-gray-800 slide-up" style="animation-delay: 0.3s">
                                    <div class="flex items-center gap-2 px-4 py-3 bg-gray-800 border-b border-gray-700">
                                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                                    </div>
                                    <div class="p-8 bg-gray-900/50 aspect-video relative flex items-center justify-center">
                                        <!-- Simulated UI Animation -->
                                        <div class="absolute inset-0 flex">
                                            <div class="w-64 bg-gray-800 border-r border-gray-700 p-4 space-y-3 hidden md:block">

                                <span class="text-xs text-gray-400">Live Preview</span>
                            </div>
                            <div id="preview-content" class="relative"></div>
                        </div>

                        <!-- Code Modal -->
                        <div id="code-modal" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4">
                            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col">
                                <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                                    <h3 class="font-bold text-lg">Installation Code</h3>
                                    <button onclick="document.getElementById('code-modal').classList.add('hidden')" class="text-gray-500"><i class="fas fa-times"></i></button>
                                </div>
                                <div class="p-4 bg-gray-50 flex-1 overflow-auto">
                                    <pre id="code-output" class="text-xs text-gray-700 font-mono whitespace-pre-wrap"></pre>
                                </div>
                                <div class="p-4 border-t border-gray-200 flex justify-end gap-2">
                                    <button onclick="navigator.clipboard.writeText(document.getElementById('code-output').innerText); alert('Copied!')" class="px-4 py-2 text-white bg-indigo-600 rounded hover:bg-indigo-700">Copy Code</button>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // Initialize Editor State
                    app.editor.init(popupId);
                }
            },

            // --- EDITOR LOGIC ---
            editor: {
                currentElements: [],
                popupSettings: { width: '400px', height: 'auto', position: 'center', bg: '#ffffff' },
                selectedId: null,
                
                init: (popupId) => {
                    app.editor.currentElements = [];
                    app.editor.selectedId = null;
                    if (popupId && popupId !== 'null') {
                        const popups = JSON.parse(localStorage.getItem(DB_KEYS.POPUPS) || '[]');
                        const popup = popups.find(p => p.id === popupId);
                        if (popup) {
                            app.editor.currentElements = popup.elements || [];
                            app.editor.popupSettings = popup.settings || app.editor.popupSettings;
                            document.getElementById('editor-title').innerText = popup.name;
                        }
                    }
                    app.editor.renderCanvas();
                    app.editor.selectPopup(); // Default select popup
                },

                renderCanvas: () => {
                    const canvas = document.getElementById('editor-canvas');
                    // Keep close button, remove rest
                    const closeBtn = document.getElementById('close-btn-preview').cloneNode(true);
                    canvas.innerHTML = '';
                    canvas.appendChild(closeBtn);
                    canvas.style.width = app.editor.popupSettings.width;
                    canvas.style.minHeight = app.editor.popupSettings.height === 'auto' ? '400px' : app.editor.popupSettings.height;
                    canvas.style.backgroundColor = app.editor.popupSettings.bg;

                    app.editor.currentElements.forEach(el => {
                        const div = document.createElement('div');
                        div.id = el.id;
                        div.className = 'absolute p-2 hover:bg-blue-50/50 cursor-pointer group';
                        div.style.left = el.x + 'px';
                        div.style.top = el.y + 'px';
                        div.style.width = el.w;
                        div.style.height = el.h;
                        div.innerHTML = el.content;
                        div.onclick = (e) => { e.stopPropagation(); app.editor.selectElement(el.id); };
                        
                        // Resize Handles (Visual only for now)
                        div.innerHTML += `<div class="resize-handle rh-br"></div>`;
                        
                        canvas.appendChild(div);
                    });
                    
                    // Re-bind close btn logic for editor
                    const newClose = canvas.querySelector('#close-btn-preview'); // ID might be duplicated, careful
                    // Actually, let's just rely on the click stopPropagation
                },

                drag: (ev, type) => {
                    ev.dataTransfer.setData("type", type);
                },
                allowDrop: (ev) => { ev.preventDefault(); },
                drop: (ev) => {
                    ev.preventDefault();
                    const type = ev.dataTransfer.getData("type");
                    const rect = document.getElementById('editor-canvas').getBoundingClientRect();
                    const x = ev.clientX - rect.left;
                    const y = ev.clientY - rect.top;
                    
                    const newEl = {
                        id: 'el-' + Date.now(),
                        type, x, y, w: 'auto', h: 'auto',
                        content: type === 'Heading' ? '<h2 class="text-2xl font-bold">Headline</h2>' :
                                 type === 'Text' ? '<p class="text-gray-600">Edit this text.</p>' :
                                 type === 'Button' ? '<button class="bg-indigo-600 text-white px-4 py-2 rounded">Click Me</button>' :
                                 type === 'Image' ? '<div class="w-32 h-32 bg-gray-200 flex items-center justify-center"><i class="fas fa-image text-2xl text-gray-400"></i></div>' :
                                 '<hr class="border-gray-300">'
                    };
                    app.editor.currentElements.push(newEl);
                    app.editor.renderCanvas();
                    app.editor.selectElement(newEl.id);
                },

                selectElement: (id) => {
                    app.editor.selectedId = id;
                    // Remove selection styles
                    document.querySelectorAll('.selected-element').forEach(el => el.classList.remove('selected-element'));
                    const elDiv = document.getElementById(id);
                    if(elDiv) {
                        elDiv.classList.add('selected-element');
                        const elData = app.editor.currentElements.find(e => e.id === id);
                        app.editor.renderProps('element', elData);
                    }
                },

                selectPopup: (e) => {
                    if (e && e.target.id !== 'editor-canvas' && e.target.id !== 'canvas-container') return;
                    app.editor.selectedId = null;
                    document.querySelectorAll('.selected-element').forEach(el => el.classList.remove('selected-element'));
                    app.editor.renderProps('popup', app.editor.popupSettings);
                },

                renderProps: (type, data) => {
                    const panel = document.getElementById('props-content');
                    if (type === 'popup') {
                        panel.innerHTML = `
                            <div class="space-y-4">
                                <div><label class="block text-xs font-bold text-gray-500">Width</label><input type="text" value="${data.width}" onchange="app.editor.updatePopup('width', this.value)" class="w-full border rounded p-2 text-sm"></div>
                                <div><label class="block text-xs font-bold text-gray-500">Height</label><input type="text" value="${data.height}" onchange="app.editor.updatePopup('height', this.value)" class="w-full border rounded p-2 text-sm"></div>
                                <div><label class="block text-xs font-bold text-gray-500">Position</label>
                                    <select onchange="app.editor.updatePopup('position', this.value)" class="w-full border rounded p-2 text-sm">
                                        <option value="center" ${data.position==='center'?'selected':''}>Center</option>
                                        <option value="top-left" ${data.position==='top-left'?'selected':''}>Top Left</option>
                                        <option value="top-right" ${data.position==='top-right'?'selected':''}>Top Right</option>
                                        <option value="bottom-left" ${data.position==='bottom-left'?'selected':''}>Bottom Left</option>
                                        <option value="bottom-right" ${data.position==='bottom-right'?'selected':''}>Bottom Right</option>
                                    </select>
                                </div>
                                <div><label class="block text-xs font-bold text-gray-500">Background</label><input type="color" value="${data.bg}" onchange="app.editor.updatePopup('bg', this.value)" class="w-full h-8 rounded cursor-pointer"></div>
                            </div>
                        `;
                    } else {
                        panel.innerHTML = `
                            <div class="space-y-3">
                                <div><label class="block text-xs font-bold text-gray-500">Width</label><input type="text" value="${data.w}" onchange="app.editor.updateElement('w', this.value)" class="w-full border rounded p-2 text-sm"></div>
                                <div><label class="block text-xs font-bold text-gray-500">Height</label><input type="text" value="${data.h}" onchange="app.editor.updateElement('h', this.value)" class="w-full border rounded p-2 text-sm"></div>
                                <div><label class="block text-xs font-bold text-gray-500">Content (HTML)</label><textarea onchange="app.editor.updateElement('content', this.value)" class="w-full border rounded p-2 text-sm h-24">${data.content}</textarea></div>
                                <button onclick="app.editor.deleteElement()" class="w-full bg-red-50 text-red-600 py-2 rounded text-sm font-bold hover:bg-red-100">Delete Element</button>
                            </div>
                        `;
                    }
                },

                updatePopup: (key, val) => {
                    app.editor.popupSettings[key] = val;
                    app.editor.renderCanvas();
                },
                updateElement: (key, val) => {
                    const el = app.editor.currentElements.find(e => e.id === app.editor.selectedId);
                    if(el) { el[key] = val; app.editor.renderCanvas(); }
                },
                deleteElement: () => {
                    app.editor.currentElements = app.editor.currentElements.filter(e => e.id !== app.editor.selectedId);
                    app.editor.selectedId = null;
                    app.editor.renderCanvas();
                    app.editor.selectPopup();
                },

                startBlank: (type) => {
                    app.editor.currentElements = [{ id: 'init', type: 'Heading', x: 20, y: 20, w: 'auto', h: 'auto', content: '<h2 class="text-2xl font-bold">New Popup</h2>' }];
                    app.editor.popupSettings.type = type;
                    app.editor.renderCanvas();
                },
                loadTemplate: (tid, type) => {
                    const t = TEMPLATES.find(x => x.id === tid);
                    // Simplified template loading for stability
                    app.editor.currentElements = [{ id: 't-init', type: 'HTML', x: 0, y: 0, w: '100%', h: 'auto', content: t.preview }];
                    app.editor.popupSettings.type = type;
                    app.editor.renderCanvas();
                },
                injectTemplate: (tid) => {
                     const t = TEMPLATES.find(x => x.id === tid);
                     app.editor.currentElements.push({ id: 't-'+Date.now(), type: 'HTML', x: 20, y: 50, w: 'auto', h: 'auto', content: t.preview });
                     app.editor.renderCanvas();
                },

                togglePreview: () => {
                    const modal = document.getElementById('preview-modal');
                    const content = document.getElementById('preview-content');
                    if (modal.style.display === 'flex') {
                        modal.style.display = 'none';
                    } else {
                        // Clone canvas content
                        const canvas = document.getElementById('editor-canvas').cloneNode(true);
                        canvas.querySelectorAll('.resize-handle, .selected-element').forEach(el => el.classList.remove('resize-handle', 'selected-element'));
                        canvas.style.position = 'fixed';
                        
                        // Apply Position Logic
                        const pos = app.editor.popupSettings.position;
                        canvas.style.top = pos.includes('top') ? '20px' : pos.includes('bottom') ? 'auto' : '50%';
                        canvas.style.bottom = pos.includes('bottom') ? '20px' : 'auto';
                        canvas.style.left = pos.includes('left') ? '20px' : pos.includes('right') ? 'auto' : '50%';
                        canvas.style.right = pos.includes('right') ? '20px' : 'auto';
                        canvas.style.transform = (pos === 'center' || pos.includes('center')) ? 'translate(-50%, -50%)' : 'none';
                        if(pos === 'top-center' || pos === 'bottom-center') canvas.style.transform = 'translateX(-50%)';
                        if(pos === 'center-left' || pos === 'center-right') canvas.style.transform = 'translateY(-50%)';

                        content.innerHTML = '';
                        content.appendChild(canvas);
                        modal.style.display = 'flex';
                    }
                },

                getCode: () => {
                    if (state.isDemo) {
                        app.ui.renderModal('signup');
                        document.querySelector('#auth-modal h2').innerText = "Save Your Work";
                        document.querySelector('#auth-modal p').innerText = "Create a free account to save this popup and access it anytime.";
                        return;
                    }
                    const code = `<!-- PopMaker Pro Code -->
<div id="pm-popup" style="display:none; position:fixed; z-index:9999; inset:0; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
  <div style="position:relative; background:${app.editor.popupSettings.bg}; width:${app.editor.popupSettings.width}; min-height:${app.editor.popupSettings.height}; border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
     <span onclick="document.getElementById('pm-popup').style.display='none'" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px;">&times;</span>
     ${app.editor.currentElements.map(e => e.content).join('')}
  </div>
</div>
<script>setTimeout(()=>document.getElementById('pm-popup').style.display='flex', 1000);<\/script>`;
                    document.getElementById('code-output').innerText = code;
                    document.getElementById('code-modal').classList.remove('hidden');
                }
            },

            // --- DATA MANAGEMENT ---
            data: {
                saveCurrent: () => {
                    if (state.isDemo) {
                        state.demoData = [{
                            id: 'demo-1', name: 'Demo Popup', elements: app.editor.currentElements, settings: app.editor.popupSettings, status: 'draft', updated: new Date()
                        }];
                        app.ui.renderModal('signup');
                        document.querySelector('#auth-modal h2').innerText = "Save Your Work";
                        document.querySelector('#auth-modal p').innerText = "Create a free account to save this popup and access it anytime.";
                        return;
                    }
                    
                    let popups = JSON.parse(localStorage.getItem(DB_KEYS.POPUPS) || '[]');
                    const existing = popups.findIndex(p => p.id === app.router.params); // Simplified ID check
                    
                    const popupData = {
                        id: app.router.params || 'new-'+Date.now(),
                        userId: state.user.id,
                        name: document.getElementById('editor-title').innerText,
                        type: app.editor.popupSettings.type || 'popup',
                        elements: app.editor.currentElements,
                        settings: app.editor.popupSettings,
                        status: 'draft',
                        updated: new Date().toISOString()
                    };

                    if (existing >= 0) popups[existing] = popupData;
                    else popups.push(popupData);

                    localStorage.setItem(DB_KEYS.POPUPS, JSON.stringify(popups));
                    alert('Popup Saved Successfully!');
                },
                deletePopup: (id) => {
                    if(!confirm('Are you sure?')) return;
                    let popups = JSON.parse(localStorage.getItem(DB_KEYS.POPUPS) || '[]');
                    popups = popups.filter(p => p.id !== id);
                    localStorage.setItem(DB_KEYS.POPUPS, JSON.stringify(popups));
                    app.router.navigate('dashboard');
                }
            }
        };

        // Start App
        window.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
