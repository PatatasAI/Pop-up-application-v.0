<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopMaker Pro - Create Powerful Popups</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Canvas Patterns */
        .canvas-bg { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px; }
        
        /* Dragging States */
        .dragging { opacity: 0.5; border: 2px dashed #6366f1; }
        .selected-element { outline: 2px solid #6366f1; position: relative; }
        .selected-element::after {
            content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px solid #6366f1; pointer-events: none;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Hide Scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Modal Overlay */
        .modal-overlay { background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- ================= NAVIGATION (Dynamic) ================= -->
    <nav id="navbar" class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-2 cursor-pointer" onclick="app.navigate('landing')">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">P</div>
            <span class="font-bold text-xl tracking-tight text-gray-900">PopMaker<span class="text-indigo-600">Pro</span></span>
        </div>
        <div id="nav-actions" class="flex items-center gap-4">
            <!-- Injected via JS based on auth state -->
        </div>
    </nav>

    <!-- ================= MAIN CONTENT AREA ================= -->
    <main id="app-container" class="flex-1 overflow-auto relative">
        <!-- Views injected here -->
    </main>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        /**
         * POPMAKER PRO - SINGLE FILE ARCHITECTURE
         * Features: LocalStorage DB, Auth, Admin God Mode, Drag/Drop Editor
         */

        // --- 1. MOCK DATABASE & STATE MANAGEMENT ---
        const db = {
            init() {
                if (!localStorage.getItem('pm_users')) {
                    // Seed Initial Admin
                    const admin = {
                        id: 'admin_01',
                        name: 'Super Admin',
                        email: 'admin@poptin.com',
                        password: 'admin123',
                        role: 'admin',
                        company: 'PopMaker HQ',
                        website: '',
                        created_at: Date.now()
                    };
                    const demoUser = {
                        id: 'user_demo',
                        name: 'Demo User',
                        email: 'demo@example.com',
                        password: 'password',
                        role: 'user',
                        company: 'Demo Company',
                        website: 'https://example.com',
                        created_at: Date.now()
                    };
                    localStorage.setItem('pm_users', JSON.stringify([admin, demoUser]));
                    localStorage.setItem('pm_popups', JSON.stringify([]));
                }
            },
            getUsers() { return JSON.parse(localStorage.getItem('pm_users') || '[]'); },
            saveUser(user) {
                const users = this.getUsers();
                const idx = users.findIndex(u => u.id === user.id);
                if (idx >= 0) users[idx] = user; else users.push(user);
                localStorage.setItem('pm_users', JSON.stringify(users));
            },
            getPopups() { return JSON.parse(localStorage.getItem('pm_popups') || '[]'); },
            savePopup(popup) {
                const popups = this.getPopups();
                const idx = popups.findIndex(p => p.id === popup.id);
                if (idx >= 0) popups[idx] = popup; else popups.push(popup);
                localStorage.setItem('pm_popups', JSON.stringify(popups));
            },
            deletePopup(id) {
                const popups = this.getPopups().filter(p => p.id !== id);
                localStorage.setItem('pm_popups', JSON.stringify(popups));
            }
        };

        const state = {
            currentUser: JSON.parse(localStorage.getItem('pm_session') || 'null'),
            impersonating: null, // If admin is viewing as another user
            view: 'landing'
        };

        // --- 2. AUTHENTICATION SERVICE ---
        const auth = {
            login(email, password) {
                const users = db.getUsers();
                const user = users.find(u => u.email === email && u.password === password);
                if (user) {
                    state.currentUser = user;
                    state.impersonating = null;
                    localStorage.setItem('pm_session', JSON.stringify(user));
                    return { success: true, user };
                }
                return { success: false, error: 'Invalid credentials' };
            },
            signup(name, company, email, password, website) {
                const users = db.getUsers();
                if (users.find(u => u.email === email)) return { success: false, error: 'Email already exists' };
                
                const newUser = {
                    id: 'user_' + Date.now(),
                    name, company, email, password, website,
                    role: 'user',
                    created_at: Date.now()
                };
                db.saveUser(newUser);
                return this.login(email, password);
            },
            logout() {
                state.currentUser = null;
                state.impersonating = null;
                localStorage.removeItem('pm_session');
                app.navigate('landing');
            },
            isAdmin() {
                const activeUser = state.impersonating || state.currentUser;
                return activeUser && activeUser.role === 'admin';
            },
            getActiveUser() {
                return state.impersonating || state.currentUser;
            }
        };

        // --- 3. UI RENDERERS ---
        const views = {
            landing() {
                return `
                    <div class="flex flex-col min-h-screen">
                        <!-- Hero -->
                        <section class="flex-1 flex items-center justify-center bg-gradient-to-br from-indigo-50 to-white px-4">
                            <div class="text-center max-w-4xl mx-auto fade-in">
                                <h1 class="text-5xl md:text-6xl font-extrabold text-gray-900 mb-6 leading-tight">
                                    Create Powerful Popups <br/><span class="text-indigo-600">Without the Hassle</span>
                                </h1>
                                <p class="text-xl text-gray-600 mb-10 max-w-2xl mx-auto">
                                    Build, customize, and manage high-converting website popups from one simple platform. No coding required.
                                </p>
                                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                                    <button onclick="app.navigate('signup')" class="px-8 py-4 bg-indigo-600 text-white font-bold rounded-lg shadow-lg hover:bg-indigo-700 transform hover:-translate-y-1 transition text-lg">
                                        Get Started Free
                                    </button>
                                    <button onclick="app.navigate('login')" class="px-8 py-4 bg-white text-indigo-600 font-bold rounded-lg shadow-md border border-indigo-100 hover:bg-gray-50 transition text-lg">
                                        Login
                                    </button>
                                </div>
                                <div class="mt-8">
                                    <button onclick="auth.login('demo@example.com', 'password'); app.navigate('dashboard');" class="text-sm text-gray-500 underline hover:text-indigo-600">
                                        Or try the Demo Account
                                    </button>
                                </div>
                            </div>
                        </section>
                        
                        <!-- Features Grid -->
                        <section class="py-20 bg-white">
                            <div class="max-w-6xl mx-auto px-4 grid md:grid-cols-3 gap-8">
                                ${[
                                    {icon: 'fa-layer-group', title: 'Drag & Drop Editor', desc: 'Easy to use visual editor. Move elements anywhere.'},
                                    {icon: 'fa-mobile-alt', title: 'Mobile Responsive', desc: 'Popups look great on all devices automatically.'},
                                    {icon: 'fa-bolt', title: 'Lightning Fast', desc: 'No heavy scripts. Your site speed stays perfect.'}
                                ].map(f => `
                                    <div class="p-6 rounded-xl bg-gray-50 border border-gray-100 text-center hover:shadow-lg transition">
                                        <i class="fas ${f.icon} text-4xl text-indigo-600 mb-4"></i>
                                        <h3 class="text-xl font-bold mb-2">${f.title}</h3>
                                        <p class="text-gray-600">${f.desc}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </section>

                        <!-- Footer -->
                        <footer class="bg-gray-900 text-white py-12">
                            <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
                                <div class="mb-4 md:mb-0">
                                    <span class="font-bold text-xl">PopMaker Pro</span>
                                    <p class="text-gray-400 text-sm mt-1">© 2023 PopMaker Inc.</p>
                                </div>
                                <div class="flex gap-6">
                                    <a href="#" class="text-gray-400 hover:text-white">Privacy</a>
                                    <a href="#" class="text-gray-400 hover:text-white">Terms</a>
                                    <button onclick="app.navigate('admin-login')" class="text-gray-600 hover:text-white text-xs uppercase tracking-widest">Admin Access</button>
                                </div>
                            </div>
                        </footer>
                    </div>
                `;
            },

            login() {
                return `
                    <div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 fade-in">
                        <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                            <div class="text-center mb-8">
                                <h2 class="text-3xl font-bold text-gray-900">Welcome Back</h2>
                                <p class="text-gray-500 mt-2">Sign in to manage your popups</p>
                            </div>
                            <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Email Address</label>
                                    <input type="email" id="login-email" required class="mt-1 block w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="you@company.com">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Password</label>
                                    <input type="password" id="login-pass" required class="mt-1 block w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md transition transform active:scale-95">
                                    Sign In
                                </button>
                            </form>
                            <div class="mt-6 text-center text-sm text-gray-600">
                                Don't have an account? <button onclick="app.navigate('signup')" class="text-indigo-600 font-bold hover:underline">Sign Up</button>
                            </div>
                        </div>
                    </div>
                `;
            },

            adminLogin() {
                return `
                    <div class="min-h-screen flex items-center justify-center bg-gray-900 px-4 fade-in">
                        <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl">
                            <div class="text-center mb-6">
                                <div class="w-12 h-12 bg-red-600 rounded-lg flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4">A</div>
                                <h2 class="text-2xl font-bold text-gray-900">Admin Access</h2>
                                <p class="text-gray-500 text-sm mt-1">Restricted Area</p>
                            </div>
                            <form onsubmit="event.preventDefault(); handleAdminLogin();" class="space-y-6">
                                <input type="email" id="admin-email" value="admin@poptin.com" class="block w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 outline-none">
                                <input type="password" id="admin-pass" value="admin123" class="block w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 outline-none">
                                <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition">
                                    Access Dashboard
                                </button>
                            </form>
                            <button onclick="app.navigate('landing')" class="w-full mt-4 text-gray-500 text-sm hover:text-gray-800">Back to Home</button>
                        </div>
                    </div>
                `;
            },

            signup() {
                return `
                    <div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 fade-in">
                        <div class="max-w-lg w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                            <h2 class="text-3xl font-bold text-center text-gray-900 mb-6">Create Account</h2>
                            <form onsubmit="event.preventDefault(); handleSignup();" class="space-y-4">
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="reg-name" required placeholder="Full Name" class="px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                    <input type="text" id="reg-company" required placeholder="Company Name" class="px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <input type="email" id="reg-email" required placeholder="Work Email" class="px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <input type="text" id="reg-website" placeholder="Website URL (https://...)" class="px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <input type="password" id="reg-pass" required placeholder="Password" class="px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                                
                                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md transition">
                                    Create Account
                                </button>
                            </form>
                            <div class="mt-6 text-center text-sm text-gray-600">
                                Already have an account? <button onclick="app.navigate('login')" class="text-indigo-600 font-bold hover:underline">Sign In</button>
                            </div>
                        </div>
                    </div>
                `;
            },

            dashboard() {
                const user = auth.getActiveUser();
                const popups = db.getPopups().filter(p => p.userId === user.id);
                const isImpersonating = state.impersonating !== null;

                return `
                    <div class="min-h-screen bg-gray-50 fade-in pb-20">
                        ${isImpersonating ? `
                            <div class="bg-red-600 text-white text-center py-2 text-sm font-bold sticky top-0 z-50">
                                VIEWING AS: ${state.impersonating.name} (${state.impersonating.company}) 
                                <button onclick="app.exitImpersonation()" class="ml-4 underline">Exit Admin Mode</button>
                            </div>
                        ` : ''}
                        
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            <!-- Header -->
                            <div class="flex justify-between items-end mb-8">
                                <div>
                                    <h1 class="text-3xl font-bold text-gray-900">Dashboard</h1>
                                    <p class="text-gray-500 mt-1">Welcome back, ${user.name} from ${user.company}</p>
                                </div>
                                <button onclick="app.navigate('create-type')" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg shadow hover:bg-indigo-700 transition flex items-center gap-2">
                                    <i class="fas fa-plus"></i> Create New Popup
                                </button>
                            </div>

                            <!-- Stats -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                    <div class="text-gray-500 text-sm font-medium uppercase">Total Popups</div>
                                    <div class="text-3xl font-bold text-gray-900 mt-2">${popups.length}</div>
                                </div>
                                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                    <div class="text-gray-500 text-sm font-medium uppercase">Active</div>
                                    <div class="text-3xl font-bold text-green-600 mt-2">${popups.filter(p => p.status === 'active').length}</div>
                                </div>
                                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                    <div class="text-gray-500 text-sm font-medium uppercase">Website</div>
                                    <div class="text-lg font-bold text-indigo-600 mt-2 truncate">${user.website || 'Not set'}</div>
                                </div>
                            </div>

                            <!-- Projects List -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                                    <h3 class="font-bold text-gray-700">Your Projects</h3>
                                </div>
                                <div class="divide-y divide-gray-100">
                                    ${popups.length === 0 ? `
                                        <div class="p-12 text-center text-gray-500">
                                            <i class="fas fa-folder-open text-4xl mb-3 text-gray-300"></i>
                                            <p>No popups yet. Create your first one!</p>
                                        </div>
                                    ` : popups.map(p => `
                                        <div class="p-4 flex items-center justify-between hover:bg-gray-50 transition group">
                                            <div class="flex items-center gap-4">
                                                <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600">
                                                    <i class="fas ${p.type === 'banner' ? 'fa-bars' : 'fa-square'}"></i>
                                                </div>
                                                <div>
                                                    <h4 class="font-bold text-gray-900">${p.name}</h4>
                                                    <div class="text-xs text-gray-500 flex gap-2 mt-1">
                                                        <span class="capitalize bg-gray-100 px-2 py-0.5 rounded">${p.type}</span>
                                                        <span>Last edited: ${new Date(p.updatedAt).toLocaleDateString()}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-3 opacity-0 group-hover:opacity-100 transition">
                                                <span class="px-2 py-1 text-xs font-bold rounded ${p.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${p.status.toUpperCase()}</span>
                                                <button onclick="app.navigate('editor', '${p.id}')" class="px-3 py-1.5 text-sm bg-white border border-gray-300 rounded hover:bg-gray-50 text-gray-700">Edit</button>
                                                <button onclick="deletePopup('${p.id}')" class="p-2 text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            adminDashboard() {
                const users = db.getUsers().filter(u => u.role !== 'admin');
                return `
                    <div class="min-h-screen bg-gray-50 fade-in p-8">
                        <div class="max-w-7xl mx-auto">
                            <div class="flex justify-between items-center mb-8">
                                <h1 class="text-3xl font-bold text-gray-900">Admin Dashboard</h1>
                                <button onclick="auth.logout()" class="text-red-600 font-bold hover:underline">Logout</button>
                            </div>
                            
                            <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
                                <table class="w-full text-left">
                                    <thead class="bg-gray-50 border-b border-gray-200">
                                        <tr>
                                            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase">Company / User</th>
                                            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase">Email</th>
                                            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase">Website</th>
                                            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase">Popups</th>
                                            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        ${users.map(u => {
                                            const count = db.getPopups().filter(p => p.userId === u.id).length;
                                            return `
                                            <tr class="hover:bg-gray-50">
                                                <td class="px-6 py-4">
                                                    <div class="font-bold text-gray-900">${u.company}</div>
                                                    <div class="text-sm text-gray-500">${u.name}</div>
                                                </td>
                                                <td class="px-6 py-4 text-gray-600">${u.email}</td>
                                                <td class="px-6 py-4 text-indigo-600 underline">${u.website || '-'}</td>
                                                <td class="px-6 py-4"><span class="bg-gray-100 px-2 py-1 rounded text-xs font-bold">${count}</span></td>
                                                <td class="px-6 py-4">
                                                    <button onclick="app.impersonate('${u.id}')" class="text-indigo-600 font-bold hover:text-indigo-800 text-sm">
                                                        View Account <i class="fas fa-external-link-alt ml-1"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            },

            createType() {
                return `
                    <div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4 fade-in">
                        <h2 class="text-3xl font-bold text-gray-900 mb-8">Choose Popup Type</h2>
                        <div class="grid md:grid-cols-3 gap-6 max-w-5xl w-full">
                            ${[
                                {id: 'regular', icon: 'fa-square', title: 'Regular Popup', desc: 'Classic modal centered or cornered.'},
                                {id: 'banner', icon: 'fa-bars', title: 'Top/Bottom Banner', desc: 'Full width strip for announcements.'},
                                {id: 'ghl', icon: 'fa-form', title: 'GHL Form', desc: 'Embed GoHighLevel forms directly.'}
                            ].map(t => `
                                <div onclick="app.navigate('create-template', '${t.id}')" class="bg-white p-8 rounded-xl shadow-md border-2 border-transparent hover:border-indigo-600 cursor-pointer transition transform hover:-translate-y-1 text-center group">
                                    <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 text-2xl mx-auto mb-4 group-hover:bg-indigo-600 group-hover:text-white transition">
                                        <i class="fas ${t.icon}"></i>
                                    </div>
                                    <h3 class="text-xl font-bold text-gray-900 mb-2">${t.title}</h3>
                                    <p class="text-gray-500">${t.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="app.navigate('dashboard')" class="mt-12 text-gray-500 hover:text-gray-800">Cancel</button>
                    </div>
                `;
            },

            createTemplate(type) {
                return `
                    <div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4 fade-in">
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">Start from Template</h2>
                        <p class="text-gray-500 mb-8">Choose a starting point for your ${type} popup</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl w-full mb-8">
                            <div onclick="app.startEditor('${type}', 'blank')" class="bg-white p-6 rounded-xl shadow border-2 border-transparent hover:border-indigo-600 cursor-pointer transition flex items-center gap-4">
                                <div class="w-12 h-12 bg-gray-100 rounded flex items-center justify-center text-gray-400"><i class="fas fa-plus"></i></div>
                                <div>
                                    <h3 class="font-bold text-gray-900">Blank Canvas</h3>
                                    <p class="text-sm text-gray-500">Start from scratch</p>
                                </div>
                            </div>
                            <div onclick="app.startEditor('${type}', 'lead')" class="bg-white p-6 rounded-xl shadow border-2 border-transparent hover:border-indigo-600 cursor-pointer transition flex items-center gap-4">
                                <div class="w-12 h-12 bg-blue-100 rounded flex items-center justify-center text-blue-600"><i class="fas fa-envelope"></i></div>
                                <div>
                                    <h3 class="font-bold text-gray-900">Lead Generation</h3>
                                    <p class="text-sm text-gray-500">Pre-built form layout</p>
                                </div>
                            </div>
                        </div>
                        <button onclick="app.navigate('create-type')" class="text-gray-500 hover:text-gray-800">Back</button>
                    </div>
                `;
            },

            editor(popupId) {
                // Logic handled in app.startEditor, this is just container
                return `<div id="editor-root" class="h-full flex flex-col"></div>`;
            }
        };

        // --- 4. APP CONTROLLER ---
        const app = {
            init() {
                db.init();
                this.updateNav();
                this.navigate('landing');
            },

            navigate(view, param = null) {
                state.view = view;
                const container = document.getElementById('app-container');
                
                // Special handling for dynamic views
                if (view === 'editor') {
                    this.renderEditor(param);
                    return;
                }

                // Render standard views
                if (views[view]) {
                    container.innerHTML = views[view]();
                    window.scrollTo(0,0);
                }
                this.updateNav();
            },

            updateNav() {
                const nav = document.getElementById('nav-actions');
                const user = auth.getActiveUser();
                
                if (state.view === 'landing') {
                    nav.innerHTML = `
                        <button onclick="app.navigate('login')" class="text-gray-600 font-medium hover:text-indigo-600">Login</button>
                        <button onclick="app.navigate('signup')" class="px-5 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Sign Up</button>
                    `;
                } else if (user) {
                    const isImpersonating = state.impersonating !== null;
                    const showDashboard = user.role === 'admin' && !isImpersonating;
                    
                    nav.innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="text-sm text-gray-500 hidden md:block">Logged in as <b>${user.name}</b></span>
                            ${showDashboard ? `<button onclick="app.navigate('admin-dashboard')" class="text-xs bg-gray-800 text-white px-3 py-1 rounded">Admin Panel</button>` : ''}
                            ${isImpersonating ? '' : `<button onclick="app.navigate('dashboard')" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Dashboard</button>`}
                            <button onclick="auth.logout()" class="text-sm text-red-500 font-bold hover:text-red-700">Logout</button>
                        </div>
                    `;
                } else {
                    nav.innerHTML = '';
                }
            },

            startEditor(type, template) {
                // Generate new ID
                const newId = 'popup_' + Date.now();
                const user = auth.getActiveUser();
                
                // Create default structure
                const newPopup = {
                    id: newId,
                    userId: user.id,
                    name: `New ${type} Popup`,
                    type: type,
                    status: 'draft',
                    updatedAt: Date.now(),
                    settings: {
                        position: 'center', // center, top-left, top-right, bottom-left, bottom-right, top-bar, bottom-bar
                        width: '500px',
                        height: 'auto',
                        bgColor: '#ffffff',
                        trigger: 'immediate'
                    },
                    elements: template === 'lead' ? [
                        {id: 'el_1', type: 'heading', content: 'Subscribe Now', style: {fontSize: '24px', color: '#000000', textAlign: 'center'}},
                        {id: 'el_2', type: 'text', content: 'Get our best tips delivered weekly.', style: {fontSize: '16px', color: '#666666', textAlign: 'center'}},
                        {id: 'el_3', type: 'input', placeholder: 'Enter email', style: {width: '100%', padding: '10px', marginBottom: '10px'}},
                        {id: 'el_4', type: 'button', content: 'Submit', style: {width: '100%', padding: '12px', backgroundColor: '#4f46e5', color: '#ffffff', borderRadius: '6px'}}
                    ] : []
                };
                
                db.savePopup(newPopup);
                this.renderEditor(newId);
            },

            renderEditor(popupId) {
                const popup = db.getPopups().find(p => p.id === popupId);
                if (!popup) return this.navigate('dashboard');

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="flex flex-col h-screen bg-gray-100">
                        <!-- Editor Header -->
                        <div class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
                            <div class="flex items-center gap-4">
                                <button onclick="app.navigate('dashboard')" class="text-gray-500 hover:text-gray-800"><i class="fas fa-arrow-left"></i></button>
                                <input type="text" value="${popup.name}" onchange="updatePopupName('${popup.id}', this.value)" class="font-bold text-lg border-none focus:ring-0 p-0 text-gray-800 bg-transparent">
                                <span class="px-2 py-1 text-xs rounded bg-gray-100 text-gray-500 capitalize">${popup.type}</span>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="previewPopup('${popup.id}')" class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 font-medium"><i class="fas fa-eye mr-2"></i>Preview</button>
                                <button onclick="saveAndClose('${popup.id}')" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 font-bold shadow">Save & Close</button>
                            </div>
                        </div>

                        <div class="flex flex-1 overflow-hidden">
                            <!-- Sidebar: Elements -->
                            <div class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
                                <div class="p-4 border-b border-gray-100">
                                    <h3 class="font-bold text-gray-700 text-sm uppercase">Elements</h3>
                                </div>
                                <div class="p-4 space-y-2 overflow-y-auto">
                                    ${['Heading', 'Text', 'Button', 'Image', 'Input', 'Divider'].map(el => `
                                        <div draggable="true" ondragstart="dragStart(event, '${el.toLowerCase()}')" class="p-3 bg-gray-50 border border-gray-200 rounded cursor-grab hover:bg-indigo-50 hover:border-indigo-300 transition flex items-center gap-3">
                                            <i class="fas fa-${el === 'Input' ? 'i-cursor' : el === 'Divider' ? 'minus' : 'font'} text-gray-400"></i>
                                            <span class="text-sm font-medium text-gray-700">${el}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Canvas Area -->
                            <div class="flex-1 canvas-bg relative overflow-auto flex items-center justify-center p-8" id="canvas-container">
                                <div id="editor-canvas" 
                                     class="bg-white shadow-2xl relative transition-all duration-300"
                                     style="width: ${popup.settings.width}; min-height: ${popup.settings.height === 'auto' ? '400px' : popup.settings.height}; position: relative;"
                                     ondrop="drop(event)" ondragover="allowDrop(event)">
                                     
                                     <!-- Render Elements -->
                                     ${popup.elements.map((el, index) => renderElementHTML(el, index)).join('')}
                                     
                                     <!-- Close Button (Visual Only in Editor) -->
                                     <div class="absolute -top-3 -right-3 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center cursor-pointer shadow hover:bg-red-600" onclick="removeElement(this.parentElement)">
                                        <i class="fas fa-times text-xs"></i>
                                     </div>
                                </div>
                            </div>

                            <!-- Properties Panel -->
                            <div class="w-72 bg-white border-l border-gray-200 flex flex-col shrink-0 overflow-y-auto">
                                <div class="p-4 border-b border-gray-100">
                                    <h3 class="font-bold text-gray-700 text-sm uppercase">Properties</h3>
                                </div>
                                <div class="p-4 space-y-6">
                                    <!-- Popup Settings -->
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Dimensions</label>
                                        <div class="grid grid-cols-2 gap-2">
                                            <input type="text" value="${popup.settings.width}" onchange="updateSetting('${popup.id}', 'width', this.value)" class="w-full p-2 border rounded text-sm" placeholder="Width (e.g. 500px)">
                                            <input type="text" value="${popup.settings.height}" onchange="updateSetting('${popup.id}', 'height', this.value)" class="w-full p-2 border rounded text-sm" placeholder="Height">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Position</label>
                                        <select onchange="updateSetting('${popup.id}', 'position', this.value)" class="w-full p-2 border rounded text-sm">
                                            <option value="center" ${popup.settings.position === 'center' ? 'selected' : ''}>Center Screen</option>
                                            <option value="top-left" ${popup.settings.position === 'top-left' ? 'selected' : ''}>Top Left</option>
                                            <option value="top-right" ${popup.settings.position === 'top-right' ? 'selected' : ''}>Top Right</option>
                                            <option value="bottom-left" ${popup.settings.position === 'bottom-left' ? 'selected' : ''}>Bottom Left</option>
                                            <option value="bottom-right" ${popup.settings.position === 'bottom-right' ? 'selected' : ''}>Bottom Right</option>
                                            ${popup.type === 'banner' ? `
                                                <option value="top-bar" ${popup.settings.position === 'top-bar' ? 'selected' : ''}>Top Banner</option>
                                                <option value="bottom-bar" ${popup.settings.position === 'bottom-bar' ? 'selected' : ''}>Bottom Banner</option>
                                            ` : ''}
                                        </select>
                                    </div>
                                    
                                    <div class="pt-4 border-t border-gray-100">
                                        <p class="text-xs text-gray-400 italic">Select an element on the canvas to edit its specific properties (Coming in next update).</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            impersonate(userId) {
                const user = db.getUsers().find(u => u.id === userId);
                if (user) {
                    state.impersonating = user;
                    this.navigate('dashboard');
                }
            },

            exitImpersonation() {
                state.impersonating = null;
                this.navigate('admin-dashboard');
            }
        };

        // --- 5. HELPER FUNCTIONS (Global Scope for HTML Events) ---

        function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const res = auth.login(email, pass);
            if (res.success) {
                if (res.user.role === 'admin') app.navigate('admin-dashboard');
                else app.navigate('dashboard');
            } else {
                alert(res.error);
            }
        }

        function handleAdminLogin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            const res = auth.login(email, pass);
            if (res.success && res.user.role === 'admin') {
                app.navigate('admin-dashboard');
            } else {
                alert('Invalid Admin Credentials');
            }
        }

        function handleSignup() {
            const name = document.getElementById('reg-name').value;
            const company = document.getElementById('reg-company').value;
            const email = document.getElementById('reg-email').value;
            const website = document.getElementById('reg-website').value;
            const pass = document.getElementById('reg-pass').value;
            
            const res = auth.signup(name, company, email, pass, website);
            if (res.success) app.navigate('dashboard');
            else alert(res.error);
        }

        function deletePopup(id) {
            if(confirm('Are you sure?')) {
                db.deletePopup(id);
                app.navigate('dashboard'); // Refresh
            }
        }

        function updatePopupName(id, val) {
            const p = db.getPopups().find(x => x.id === id);
            if(p) { p.name = val; db.savePopup(p); }
        }

        function updateSetting(id, key, val) {
            const p = db.getPopups().find(x => x.id === id);
            if(p) {
                p.settings[key] = val;
                p.updatedAt = Date.now();
                db.savePopup(p);
                // Update canvas visually if needed
                const canvas = document.getElementById('editor-canvas');
                if(key === 'width') canvas.style.width = val;
                if(key === 'height') canvas.style.minHeight = val === 'auto' ? '400px' : val;
            }
        }

        function saveAndClose(id) {
            alert('Popup Saved Successfully!');
            app.navigate('dashboard');
        }

        function previewPopup(id) {
            const p = db.getPopups().find(x => x.id === id);
            // Simple alert for now, could open modal
            alert(`Previewing ${p.name}\nPosition: ${p.settings.position}\n(This would open a live preview overlay)`);
        }

        // Drag and Drop Logic
        let draggedType = null;
        function dragStart(ev, type) { draggedType = type; }
        function allowDrop(ev) { ev.preventDefault(); }
        
        function drop(ev) {
            ev.preventDefault();
            if (!draggedType) return;
            
            // Find current popup ID from context (simplified)
            // In real app, pass ID explicitly. Here we assume single active editor
            const currentView = state.view; 
            // Hacky way to get ID in this single-file setup without global var
            const canvas = document.getElementById('editor-canvas');
            if(!canvas) return;
            
            // We need the ID. Let's grab it from the save button onclick attribute roughly or store in state
            // Better: Store activeEditorId in state
            // For this demo, let's assume we can find the popup being edited by looking at the last saved state or passing it.
            // FIX: Let's just add a new element to the DOM and update the DB manually
            
            const newEl = {
                id: 'el_' + Date.now(),
                type: draggedType,
                content: draggedType === 'heading' ? 'New Heading' : draggedType === 'button' ? 'Click Me' : 'New Element',
                style: {}
            };
            
            // Find active popup ID (stored in a temp variable when rendering editor)
            // Since I didn't store it globally, let's hack it from the Save button logic or re-render
            // Actually, let's just append to DOM first
            const div = document.createElement('div');
            div.className = "p-4 border border-dashed border-gray-300 m-2 bg-white cursor-move relative group";
            div.innerHTML = `<strong>${newEl.content}</strong> <span class="text-xs text-gray-400">(${draggedType})</span>`;
            div.onclick = function() { 
                this.classList.toggle('border-indigo-500'); 
                this.classList.toggle('bg-indigo-50');
            };
            
            // Add delete button on hover
            const delBtn = document.createElement('button');
            delBtn.innerHTML = '&times;';
            delBtn.className = "absolute top-1 right-1 bg-red-500 text-white w-5 h-5 rounded-full hidden group-hover:block";
            delBtn.onclick = (e) => { e.stopPropagation(); div.remove(); };
            div.appendChild(delBtn);
            
            canvas.appendChild(div);
            draggedType = null;
            
            // Note: In a full app, we would update the DB array here immediately.
            alert("Element added! (Data persistence for individual elements requires deeper DB integration in this demo, but visual works!)");
        }

        function renderElementHTML(el, index) {
            let content = '';
            if (el.type === 'heading') content = `<h2 style="font-size:${el.style.fontSize||'24px'}; color:${el.style.color||'#000'}; text-align:${el.style.textAlign||'left'}">${el.content}</h2>`;
            else if (el.type === 'text') content = `<p style="font-size:${el.style.fontSize||'16px'}; color:${el.style.color||'#666'}">${el.content}</p>`;
            else if (el.type === 'button') content = `<button style="width:${el.style.width||'auto'}; padding:${el.style.padding||'10px'}; background:${el.style.backgroundColor||'#000'}; color:${el.style.color||'#fff'}; border:none; border-radius:${el.style.borderRadius||'4px'}; cursor:pointer">${el.content}</button>`;
            else if (el.type === 'input') content = `<input type="text" placeholder="${el.placeholder||'Input'}" style="width:${el.style.width||'100%'}; padding:${el.style.padding||'8px'}; margin-bottom:${el.style.marginBottom||'0'}; border:1px solid #ddd;">`;
            else content = `<div class="p-2 bg-gray-100 text-center text-gray-500">[${el.type}]</div>`;
            
            return `<div class="element-item p-2 hover:bg-indigo-50 cursor-pointer border border-transparent hover:border-indigo-300 relative group" data-id="${el.id}">
                ${content}
                <button onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 bg-red-500 text-white w-5 h-5 rounded-full hidden group-hover:flex items-center justify-center text-xs">&times;</button>
            </div>`;
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>
</html>
