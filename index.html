<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopMaker Pro - SaaS Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Optimized Animations */
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Editor Specifics */
        .canvas-area { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px; }
        .draggable-item { cursor: grab; transition: all 0.1s; }
        .draggable-item:active { cursor: grabbing; }
        .selected-element { outline: 2px solid #3b82f6; position: relative; }
        .element-handle { position: absolute; bottom: -5px; right: -5px; width: 10px; height: 10px; background: #3b82f6; cursor: se-resize; display: none; }
        .selected-element .element-handle { display: block; }
        .delete-btn { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .selected-element:hover .delete-btn { opacity: 1; }

        /* Preview Overlay */
        .preview-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; }
        .preview-popup { position: absolute; background: white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        
        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden flex flex-col">

    <!-- ================= NAVIGATION ================= -->
    <nav id="mainNav" class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shadow-sm z-50 relative">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">P</div>
            <span class="font-bold text-xl tracking-tight text-slate-900">PopMaker<span class="text-indigo-600">Pro</span></span>
        </div>
        <div id="navLinks" class="flex items-center gap-4">
            <!-- Dynamic Content -->
        </div>
    </nav>

    <!-- ================= VIEWS CONTAINER ================= -->
    <main id="appContainer" class="flex-1 overflow-auto relative">
        <!-- Views injected here -->
    </main>

    <!-- ================= TEMPLATES ================= -->
    
    <!-- 1. LANDING PAGE -->
    <template id="view-landing">
        <div class="fade-in">
            <!-- Hero -->
            <section class="relative pt-20 pb-32 overflow-hidden">
                <div class="container mx-auto px-6 text-center relative z-10">
                    <span class="inline-block py-1 px-3 rounded-full bg-indigo-50 text-indigo-600 text-sm font-semibold mb-6">v2.0 Now Live</span>
                    <h1 class="text-5xl md:text-6xl font-extrabold text-slate-900 mb-6 leading-tight">
                        Create Powerful Popups <br> <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Without the Hassle</span>
                    </h1>
                    <p class="text-xl text-slate-600 mb-10 max-w-2xl mx-auto">
                        Build, customize, and manage high-converting website popups from one simple platform. No coding required.
                    </p>
                    <div class="flex justify-center gap-4">
                        <button onclick="router('signup')" class="px-8 py-4 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg hover:shadow-xl transform hover:-translate-y-1">Get Started Free</button>
                        <button onclick="router('login')" class="px-8 py-4 bg-white text-slate-700 border border-slate-200 rounded-lg font-bold hover:bg-slate-50 transition">Login</button>
                    </div>
                </div>
                <!-- Abstract BG Shape -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full z-0 opacity-30 pointer-events-none">
                    <div class="absolute top-20 left-10 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl animate-blob"></div>
                    <div class="absolute top-20 right-10 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-xl animate-blob animation-delay-2000"></div>
                </div>
            </section>

            <!-- Features Grid -->
            <section class="py-20 bg-white">
                <div class="container mx-auto px-6">
                    <div class="grid md:grid-cols-3 gap-12">
                        <div class="p-6">
                            <div class="w-12 h-12 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600 mb-4"><i class="fas fa-mouse-pointer text-xl"></i></div>
                            <h3 class="text-xl font-bold mb-2">Drag & Drop Editor</h3>
                            <p class="text-slate-600">Intuitive interface to build popups exactly how you imagine them.</p>
                        </div>
                        <div class="p-6">
                            <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600 mb-4"><i class="fas fa-layer-group text-xl"></i></div>
                            <h3 class="text-xl font-bold mb-2">Smart Templates</h3>
                            <p class="text-slate-600">Start with pro-designed templates for leads, sales, and announcements.</p>
                        </div>
                        <div class="p-6">
                            <div class="w-12 h-12 bg-pink-100 rounded-lg flex items-center justify-center text-pink-600 mb-4"><i class="fas fa-chart-line text-xl"></i></div>
                            <h3 class="text-xl font-bold mb-2">High Converting</h3>
                            <p class="text-slate-600">Exit intent, scroll triggers, and timing delays to maximize conversions.</p>
                        </div>
                    </div>
                </div>
            </section>
            
            <footer class="bg-slate-900 text-slate-400 py-12 text-center">
                <p>&copy; 2023 PopMaker Pro. All rights reserved.</p>
            </footer>
        </div>
    </template>

    <!-- 2. AUTH (LOGIN/SIGNUP) -->
    <template id="view-auth">
        <div class="min-h-[calc(100vh-64px)] flex items-center justify-center p-4 fade-in">
            <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                <div class="text-center mb-8">
                    <h2 id="authTitle" class="text-2xl font-bold text-slate-900">Welcome Back</h2>
                    <p class="text-slate-500 mt-2">Enter your details to access your account</p>
                </div>
                
                <form id="authForm" class="space-y-4">
                    <div id="companyField" class="hidden">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Company Name</label>
                        <input type="text" id="inpCompany" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                        <input type="email" id="inpEmail" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <input type="password" id="inpPassword" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    
                    <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition flex justify-center items-center gap-2">
                        <span id="btnText">Sign In</span>
                        <div id="btnLoader" class="loader hidden"></div>
                    </button>
                </form>

                <div class="mt-6 text-center text-sm text-slate-600">
                    <span id="authSwitchText">Don't have an account?</span>
                    <button id="authSwitchBtn" class="text-indigo-600 font-bold hover:underline ml-1">Sign Up</button>
                </div>
                <div class="mt-4 text-center">
                     <button onclick="router('admin-login')" class="text-xs text-slate-400 hover:text-slate-600 underline">Staff Login</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 3. ADMIN LOGIN (Separate) -->
    <template id="view-admin-login">
        <div class="min-h-[calc(100vh-64px)] flex items-center justify-center p-4 fade-in">
            <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-red-500">
                <div class="text-center mb-6">
                    <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl"><i class="fas fa-shield-alt"></i></div>
                    <h2 class="text-2xl font-bold text-slate-900">Admin Access</h2>
                    <p class="text-slate-500 text-sm">Restricted area. Authorized personnel only.</p>
                </div>
                <form id="adminAuthForm" class="space-y-4">
                    <input type="email" id="admEmail" placeholder="Admin Email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg">
                    <input type="password" id="admPass" placeholder="Password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg">
                    <button type="submit" class="w-full py-3 bg-slate-900 text-white font-bold rounded-lg hover:bg-slate-800">Access Dashboard</button>
                </form>
                <div class="mt-4 text-center">
                    <button onclick="router('login')" class="text-sm text-slate-500 hover:text-slate-800">← Back to User Login</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 4. USER DASHBOARD -->
    <template id="view-dashboard">
        <div class="container mx-auto px-6 py-8 fade-in">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-slate-900">Dashboard</h1>
                    <p class="text-slate-500 mt-1">Welcome back, <span id="dashUserName" class="font-semibold text-indigo-600">User</span></p>
                    <p class="text-xs text-slate-400 mt-1">Company: <span id="dashCompanyName">Loading...</span></p>
                </div>
                <button onclick="handleCreateNew()" class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 shadow-md flex items-center gap-2">
                    <i class="fas fa-plus"></i> Create New Popup
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-sm font-medium mb-1">Total Popups</div>
                    <div class="text-3xl font-bold text-slate-900" id="statTotal">0</div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-sm font-medium mb-1">Active</div>
                    <div class="text-3xl font-bold text-emerald-600" id="statActive">0</div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-sm font-medium mb-1">Drafts</div>
                    <div class="text-3xl font-bold text-amber-500" id="statDraft">0</div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-sm font-medium mb-1">Views (Sim)</div>
                    <div class="text-3xl font-bold text-indigo-600">1.2k</div>
                </div>
            </div>

            <!-- Projects List -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-bold text-slate-700">Recent Projects</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-xs uppercase font-semibold text-slate-500">
                            <tr>
                                <th class="px-6 py-3">Popup Name</th>
                                <th class="px-6 py-3">Type</th>
                                <th class="px-6 py-3">Status</th>
                                <th class="px-6 py-3">Last Updated</th>
                                <th class="px-6 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="projectsTableBody" class="divide-y divide-slate-100">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="hidden p-12 text-center">
                    <div class="inline-block p-4 bg-slate-50 rounded-full mb-4"><i class="fas fa-folder-open text-3xl text-slate-300"></i></div>
                    <h3 class="text-lg font-bold text-slate-700">No popups yet</h3>
                    <p class="text-slate-500 mb-6">Create your first popup to get started.</p>
                    <button onclick="handleCreateNew()" class="text-indigo-600 font-bold hover:underline">Create One Now</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 5. ADMIN DASHBOARD -->
    <template id="view-admin-dash">
        <div class="container mx-auto px-6 py-8 fade-in">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-slate-900">Admin Dashboard</h1>
                    <p class="text-slate-500 mt-1">Manage users, companies, and system health.</p>
                    <div id="impersonateBadge" class="hidden mt-2 inline-flex items-center gap-2 bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm font-bold border border-red-200">
                        <i class="fas fa-user-secret"></i> Viewing as: <span id="impersonateName"></span>
                        <button onclick="adminExitImpersonation()" class="ml-2 hover:text-red-900 underline">Exit Mode</button>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="router('dashboard')" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50">User View</button>
                    <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Logout</button>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
                    <h3 class="font-bold text-slate-700">All Accounts</h3>
                </div>
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-xs uppercase font-semibold text-slate-500">
                        <tr>
                            <th class="px-6 py-3">Company / User</th>
                            <th class="px-6 py-3">Email</th>
                            <th class="px-6 py-3">Plan</th>
                            <th class="px-6 py-3">Popups</th>
                            <th class="px-6 py-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersTable" class="divide-y divide-slate-100">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <!-- 6. CREATE FLOW (Modal) -->
    <template id="view-create-flow">
        <div class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 fade-in">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden slide-up">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-800">Create New Popup</h2>
                    <button onclick="closeModal('createFlowModal')" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <div class="p-8">
                    <!-- Step 1: Type -->
                    <div id="stepType">
                        <h3 class="text-lg font-semibold mb-4">1. Choose Popup Type</h3>
                        <div class="grid md:grid-cols-3 gap-4">
                            <div onclick="selectPopupType('regular')" class="cursor-pointer border-2 border-indigo-600 bg-indigo-50 p-6 rounded-xl text-center hover:shadow-md transition">
                                <i class="fas fa-window-maximize text-3xl text-indigo-600 mb-3"></i>
                                <h4 class="font-bold text-slate-800">Regular Popup</h4>
                                <p class="text-xs text-slate-500 mt-1">Standard modal window</p>
                            </div>
                            <div onclick="selectPopupType('banner')" class="cursor-pointer border-2 border-slate-200 p-6 rounded-xl text-center hover:border-indigo-600 hover:bg-indigo-50 transition">
                                <i class="fas fa-bars text-3xl text-slate-400 mb-3"></i>
                                <h4 class="font-bold text-slate-800">Banner</h4>
                                <p class="text-xs text-slate-500 mt-1">Top or Bottom bar</p>
                            </div>
                            <div onclick="selectPopupType('ghl')" class="cursor-pointer border-2 border-slate-200 p-6 rounded-xl text-center hover:border-indigo-600 hover:bg-indigo-50 transition">
                                <i class="fas fa-file-signature text-3xl text-slate-400 mb-3"></i>
                                <h4 class="font-bold text-slate-800">GHL Form</h4>
                                <p class="text-xs text-slate-500 mt-1">Embed GoHighLevel</p>
                            </div>
                        </div>
                    </div>

                    <!-- Step 2: Template -->
                    <div id="stepTemplate" class="hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-semibold">2. Start From</h3>
                            <button onclick="resetCreateFlow()" class="text-sm text-slate-500 hover:text-slate-800">← Back</button>
                        </div>
                        <div class="grid md:grid-cols-2 gap-4 mb-6">
                            <div onclick="startEditor('blank')" class="cursor-pointer border-2 border-dashed border-slate-300 p-8 rounded-xl text-center hover:border-indigo-600 hover:bg-slate-50 transition">
                                <i class="fas fa-plus text-3xl text-slate-400 mb-2"></i>
                                <h4 class="font-bold text-slate-800">Blank Canvas</h4>
                            </div>
                            <!-- Simple Template Placeholder -->
                            <div onclick="startEditor('template_lead')" class="cursor-pointer border-2 border-slate-200 p-4 rounded-xl hover:border-indigo-600 transition flex items-center gap-4">
                                <div class="w-16 h-12 bg-blue-100 rounded flex items-center justify-center text-blue-600"><i class="fas fa-envelope"></i></div>
                                <div class="text-left">
                                    <h4 class="font-bold text-slate-800">Lead Gen Basic</h4>
                                    <p class="text-xs text-slate-500">Email capture focused</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 7. EDITOR -->
    <template id="view-editor">
        <div class="flex h-[calc(100vh-64px)] fade-in">
            <!-- Left Sidebar: Elements -->
            <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10">
                <div class="p-4 border-b border-slate-100">
                    <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wide">Elements</h3>
                </div>
                <div class="p-4 space-y-3 overflow-y-auto flex-1">
                    <div draggable="true" ondragstart="editor.dragStart(event, 'heading')" class="draggable-item p-3 bg-slate-50 border border-slate-200 rounded hover:border-indigo-500 hover:bg-indigo-50 flex items-center gap-3">
                        <i class="fas fa-heading text-slate-400"></i> <span class="text-sm font-medium">Heading</span>
                    </div>
                    <div draggable="true" ondragstart="editor.dragStart(event, 'text')" class="draggable-item p-3 bg-slate-50 border border-slate-200 rounded hover:border-indigo-500 hover:bg-indigo-50 flex items-center gap-3">
                        <i class="fas fa-paragraph text-slate-400"></i> <span class="text-sm font-medium">Text Block</span>
                    </div>
                    <div draggable="true" ondragstart="editor.dragStart(event, 'button')" class="draggable-item p-3 bg-slate-50 border border-slate-200 rounded hover:border-indigo-500 hover:bg-indigo-50 flex items-center gap-3">
                        <i class="fas fa-square text-slate-400"></i> <span class="text-sm font-medium">Button</span>
                    </div>
                    <div draggable="true" ondragstart="editor.dragStart(event, 'image')" class="draggable-item p-3 bg-slate-50 border border-slate-200 rounded hover:border-indigo-500 hover:bg-indigo-50 flex items-center gap-3">
                        <i class="fas fa-image text-slate-400"></i> <span class="text-sm font-medium">Image</span>
                    </div>
                    <div draggable="true" ondragstart="editor.dragStart(event, 'video')" class="draggable-item p-3 bg-slate-50 border border-slate-200 rounded hover:border-indigo-500 hover:bg-indigo-50 flex items-center gap-3">
                        <i class="fas fa-video text-slate-400"></i> <span class="text-sm font-medium">Video</span>
                    </div>
                    <div draggable="true" ondragstart="editor.dragStart(event, 'social')" class="draggable-item p-3 bg-slate-50 border border-slate-200 rounded hover:border-indigo-500 hover:bg-indigo-50 flex items-center gap-3">
                        <i class="fas fa-share-alt text-slate-400"></i> <span class="text-sm font-medium">Social Icons</span>
                    </div>
                    <div draggable="true" ondragstart="editor.dragStart(event, 'divider')" class="draggable-item p-3 bg-slate-50 border border-slate-200 rounded hover:border-indigo-500 hover:bg-indigo-50 flex items-center gap-3">
                        <i class="fas fa-minus text-slate-400"></i> <span class="text-sm font-medium">Divider</span>
                    </div>
                </div>
            </aside>

            <!-- Center: Canvas -->
            <main class="flex-1 canvas-area relative overflow-auto flex items-center justify-center p-8" id="editorCanvasArea" ondrop="editor.drop(event)" ondragover="editor.allowDrop(event)">
                
                <!-- The Popup Representation -->
                <div id="editorPopup" class="bg-white shadow-2xl relative transition-all duration-300" style="width: 400px; min-height: 300px;">
                    <!-- Close Button (Visual in Editor) -->
                    <div class="absolute -top-3 -right-3 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center cursor-pointer shadow-md z-20" title="Close Button">
                        <i class="fas fa-times text-xs"></i>
                    </div>
                    
                    <!-- Drop Zone Inside Popup -->
                    <div id="popupContentZone" class="w-full h-full min-h-[200px] p-4 relative">
                        <!-- Elements go here -->
                        <div class="absolute inset-0 flex items-center justify-center text-slate-300 pointer-events-none" id="emptyStateMsg">
                            <span class="text-sm">Drag elements here</span>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white px-4 py-2 rounded-full shadow-lg border border-slate-200 flex gap-4 text-sm font-medium text-slate-600 z-20">
                    <button onclick="editor.togglePreview()" class="hover:text-indigo-600 flex items-center gap-2"><i class="fas fa-eye"></i> Preview</button>
                    <button onclick="saveProject()" class="text-indigo-600 hover:text-indigo-800 flex items-center gap-2"><i class="fas fa-save"></i> Save</button>
                    <button onclick="router('dashboard')" class="hover:text-red-600 flex items-center gap-2"><i class="fas fa-arrow-left"></i> Exit</button>
                </div>
            </main>

            <!-- Right: Properties -->
            <aside class="w-72 bg-white border-l border-slate-200 p-4 overflow-y-auto z-10">
                <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wide mb-4">Properties</h3>
                
                <div id="propsGlobal" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Popup Name</label>
                        <input type="text" id="propPopupName" class="w-full text-sm border border-slate-300 rounded p-2">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Position</label>
                        <select id="propPosition" class="w-full text-sm border border-slate-300 rounded p-2 bg-white">
                            <option value="center">Center Screen</option>
                            <option value="top">Top Bar</option>
                            <option value="bottom">Bottom Bar</option>
                            <option value="top-left">Top Left Corner</option>
                            <option value="top-right">Top Right Corner</option>
                            <option value="bottom-left">Bottom Left Corner</option>
                            <option value="bottom-right">Bottom Right Corner</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Width (px)</label>
                            <input type="number" id="propWidth" value="400" class="w-full text-sm border border-slate-300 rounded p-2">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Height (auto)</label>
                            <input type="text" value="Auto" disabled class="w-full text-sm border border-slate-200 bg-slate-50 rounded p-2 text-slate-400">
                        </div>
                    </div>
                    <hr class="border-slate-100">
                    <p class="text-xs text-slate-400 italic">Select an element on canvas to edit its specific properties.</p>
                </div>

                <div id="propsElement" class="hidden space-y-4 pt-4 border-t border-slate-100">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-indigo-600 uppercase">Editing: <span id="selectedElType">Element</span></span>
                        <button onclick="editor.deselect()" class="text-xs text-slate-400 hover:text-red-500">Deselect</button>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Content / Text</label>
                        <textarea id="propContent" rows="2" class="w-full text-sm border border-slate-300 rounded p-2"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Font Size</label>
                            <input type="number" id="propFontSize" class="w-full text-sm border border-slate-300 rounded p-2">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Color</label>
                            <input type="color" id="propColor" class="w-full h-8 border border-slate-300 rounded p-0">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Link URL (Buttons/Images)</label>
                        <input type="text" id="propLink" placeholder="https://..." class="w-full text-sm border border-slate-300 rounded p-2">
                    </div>

                    <div class="pt-2">
                         <button onclick="editor.updateSelectedElement()" class="w-full py-2 bg-indigo-600 text-white text-sm font-bold rounded hover:bg-indigo-700">Update Element</button>
                    </div>
                </div>
            </aside>
        </div>
    </template>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // --- STATE MANAGEMENT ---
        const DB_KEY = 'popmaker_pro_db_v2';
        const SESSION_KEY = 'popmaker_session';
        
        let db = {
            users: [], // { id, name, email, password, company, role: 'user'|'admin', popups: [] }
            popups: [] // { id, userId, name, type, position, width, elements: [], status: 'draft'|'active', updated: date }
        };
        
        let currentUser = null;
        let impersonating = false;

        // --- INITIALIZATION ---
        function init() {
            loadData();
            checkSession();
            
            // Default Admin if not exists
            if (!db.users.find(u => u.email === 'admin@poptin.com')) {
                db.users.push({
                    id: 'admin_001',
                    name: 'Super Admin',
                    email: 'admin@poptin.com',
                    password: 'admin123', // In real app, hash this!
                    company: 'PopMaker HQ',
                    role: 'admin',
                    popups: []
                });
                saveData();
            }
            
            router('landing');
        }

        function loadData() {
            const stored = localStorage.getItem(DB_KEY);
            if (stored) db = JSON.parse(stored);
        }

        function saveData() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function checkSession() {
            const sess = sessionStorage.getItem(SESSION_KEY);
            if (sess) {
                const { userId, isAdmin } = JSON.parse(sess);
                const user = db.users.find(u => u.id === userId);
                if (user) {
                    currentUser = user;
                    impersonating = !!sessionStorage.getItem('impersonating');
                    if (isAdmin || impersonating) {
                        // If admin logged in normally
                        if(!impersonating && user.role === 'admin') router('admin-dash');
                        // If impersonating or normal user
                        else router('dashboard');
                    } else {
                        router('dashboard');
                    }
                    updateNav();
                }
            }
        }

        // --- ROUTER ---
        function router(viewName, params = null) {
            const container = document.getElementById('appContainer');
            const template = document.getElementById(`view-${viewName}`);
            
            if (!template) return console.error('View not found:', viewName);

            container.innerHTML = '';
            container.appendChild(template.content.cloneNode(true));
            
            // Post-render logic
            if (viewName === 'landing') updateNav();
            if (viewName === 'login' || viewName === 'signup') setupAuth(viewName);
            if (viewName === 'admin-login') setupAdminAuth();
            if (viewName === 'dashboard') loadDashboard();
            if (viewName === 'admin-dash') loadAdminDash();
            if (viewName === 'editor') initEditor(params);
            
            window.scrollTo(0,0);
        }

        function updateNav() {
            const nav = document.getElementById('navLinks');
            if (currentUser) {
                let extraBtn = '';
                if (impersonating) {
                    extraBtn = `<button onclick="adminExitImpersonation()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold mr-2">Exit Admin Mode</button>`;
                }
                nav.innerHTML = `
                    ${extraBtn}
                    <span class="text-sm text-slate-600 hidden md:inline">Hi, ${currentUser.name}</span>
                    <button onclick="logout()" class="text-sm font-bold text-slate-600 hover:text-red-600">Logout</button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="router('login')" class="text-sm font-bold text-slate-600 hover:text-indigo-600">Login</button>
                    <button onclick="router('signup')" class="px-4 py-2 bg-indigo-600 text-white text-sm font-bold rounded-lg hover:bg-indigo-700">Sign Up</button>
                `;
            }
        }

        // --- AUTHENTICATION ---
        let isSignupMode = false;

        function setupAuth(mode) {
            isSignupMode = mode === 'signup';
            const form = document.getElementById('authForm');
            const title = document.getElementById('authTitle');
            const companyField = document.getElementById('companyField');
            const switchBtn = document.getElementById('authSwitchBtn');
            const switchText = document.getElementById('authSwitchText');
            const btnText = document.getElementById('btnText');

            if (isSignupMode) {
                title.innerText = 'Create Account';
                companyField.classList.remove('hidden');
                switchBtn.innerText = 'Sign In';
                switchText.innerText = 'Already have an account?';
                btnText.innerText = 'Sign Up';
            } else {
                title.innerText = 'Welcome Back';
                companyField.classList.add('hidden');
                switchBtn.innerText = 'Sign Up';
                switchText.innerText = "Don't have an account?";
                btnText.innerText = 'Sign In';
            }

            form.onsubmit = (e) => {
                e.preventDefault();
                const email = document.getElementById('inpEmail').value;
                const pass = document.getElementById('inpPassword').value;
                const company = document.getElementById('inpCompany').value;

                if (isSignupMode) {
                    if (db.users.find(u => u.email === email)) {
                        alert('Email already exists!');
                        return;
                    }
                    const newUser = {
                        id: 'usr_' + Date.now(),
                        name: email.split('@')[0],
                        email,
                        password: pass,
                        company: company || 'My Company',
                        role: 'user',
                        popups: []
                    };
                    db.users.push(newUser);
                    saveData();
                    loginUser(newUser);
                } else {
                    const user = db.users.find(u => u.email === email && u.password === pass);
                    if (user) {
                        if (user.role === 'admin') {
                            // Force redirect to admin dash for admin login from main page? 
                            // Or let them choose. Let's send admins to admin dash.
                            loginUser(user, true);
                        } else {
                            loginUser(user);
                        }
                    } else {
                        alert('Invalid credentials');
                    }
                }
            };

            switchBtn.onclick = () => router(isSignupMode ? 'login' : 'signup');
        }

        function setupAdminAuth() {
            document.getElementById('adminAuthForm').onsubmit = (e) => {
                e.preventDefault();
                const email = document.getElementById('admEmail').value;
                const pass = document.getElementById('admPass').value;
                const user = db.users.find(u => u.email === email && u.password === pass && u.role === 'admin');
                
                if (user) {
                    loginUser(user, true);
                } else {
                    alert('Access Denied: Admin credentials invalid.');
                }
            };
        }

        function loginUser(user, isAdmin = false) {
            currentUser = user;
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId: user.id, isAdmin }));
            if (impersonating) sessionStorage.setItem('impersonating', 'true');
            
            updateNav();
            router(isAdmin && !impersonating ? 'admin-dash' : 'dashboard');
        }

        function logout() {
            currentUser = null;
            impersonating = false;
            sessionStorage.removeItem(SESSION_KEY);
            sessionStorage.removeItem('impersonating');
            updateNav();
            router('landing');
        }

        // --- ADMIN FEATURES ---
        function loadAdminDash() {
            const tbody = document.getElementById('adminUsersTable');
            tbody.innerHTML = '';
            
            db.users.filter(u => u.role !== 'admin').forEach(u => {
                const popupCount = db.popups.filter(p => p.userId === u.id).length;
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 border-b border-slate-100';
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-bold text-indigo-600 cursor-pointer hover:underline" onclick="adminImpersonate('${u.id}')">${u.company}</div>
                        <div class="text-xs text-slate-500">${u.name}</div>
                    </td>
                    <td class="px-6 py-4">${u.email}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 bg-slate-100 rounded text-xs font-bold">Free</span></td>
                    <td class="px-6 py-4 font-bold text-slate-700">${popupCount}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="adminImpersonate('${u.id}')" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold border border-indigo-200 px-3 py-1 rounded hover:bg-indigo-50">View Account</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function adminImpersonate(userId) {
            const user = db.users.find(u => u.id === userId);
            if (!user) return;
            
            currentUser = user;
            impersonating = true;
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId: user.id, isAdmin: false })); // Treat as user
            sessionStorage.setItem('impersonating', 'true');
            
            document.getElementById('impersonateName').innerText = user.company;
            document.getElementById('impersonateBadge').classList.remove('hidden');
            
            loadDashboard(); // Refresh dashboard for this user
            // We stay on the admin-dash view structure but swap content? 
            // Better to route to dashboard but keep admin header info
            const container = document.getElementById('appContainer');
            // Re-render dashboard part manually or just call router
            // Let's just update the view content to dashboard
            router('dashboard');
        }

        function adminExitImpersonation() {
            impersonating = false;
            sessionStorage.removeItem('impersonating');
            // Find original admin
            const admin = db.users.find(u => u.role === 'admin');
            currentUser = admin;
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId: admin.id, isAdmin: true }));
            document.getElementById('impersonateBadge').classList.add('hidden');
            router('admin-dash');
        }

        // --- DASHBOARD LOGIC ---
        function loadDashboard() {
            if (!currentUser) return;
            
            document.getElementById('dashUserName').innerText = currentUser.name;
            document.getElementById('dashCompanyName').innerText = currentUser.company;
            
            const userPopups = db.popups.filter(p => p.userId === currentUser.id);
            
            // Stats
            document.getElementById('statTotal').innerText = userPopups.length;
            document.getElementById('statActive').innerText = userPopups.filter(p => p.status === 'active').length;
            document.getElementById('statDraft').innerText = userPopups.filter(p => p.status === 'draft').length;
            
            // Table
            const tbody = document.getElementById('projectsTableBody');
            tbody.innerHTML = '';
            
            if (userPopups.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            userPopups.sort((a,b) => new Date(b.updated) - new Date(a.updated)).forEach(p => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50';
                const date = new Date(p.updated).toLocaleDateString();
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-slate-700">${p.name}</td>
                    <td class="px-6 py-4 capitalize">${p.type}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-bold ${p.status === 'active' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${p.status}</span></td>
                    <td class="px-6 py-4 text-slate-500">${date}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="openEditor('${p.id}')" class="text-indigo-600 hover:text-indigo-800 font-bold text-sm mr-3">Edit</button>
                        <button onclick="deletePopup('${p.id}')" class="text-red-400 hover:text-red-600 text-sm"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleCreateNew() {
            document.getElementById('createFlowModal').classList.remove('hidden'); // Handled in template logic usually, but here we render modal in view
            // Since modal is in template, we need to ensure it's visible. 
            // Actually, let's just router to a view that includes the modal or append it.
            // Simpler: The template has the modal hidden by default? No, template is static.
            // Let's just append the modal to body if not present
            if(!document.getElementById('createFlowModal')) {
                 const tpl = document.getElementById('view-create-flow');
                 const clone = tpl.content.cloneNode(true);
                 // Extract the inner div and append to body
                 const modal = clone.querySelector('div');
                 modal.id = 'createFlowModal';
                 document.body.appendChild(modal);
            } else {
                document.getElementById('createFlowModal').classList.remove('hidden');
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        let selectedType = null;

        function selectPopupType(type) {
            selectedType = type;
            document.getElementById('stepType').classList.add('hidden');
            document.getElementById('stepTemplate').classList.remove('hidden');
        }

        function resetCreateFlow() {
            selectedType = null;
            document.getElementById('stepType').classList.remove('hidden');
            document.getElementById('stepTemplate').classList.add('hidden');
        }

        function startEditor(template) {
            closeModal('createFlowModal');
            // Create new popup object
            const newPopup = {
                id: 'pop_' + Date.now(),
                userId: currentUser.id,
                name: 'Untitled ' + selectedType,
                type: selectedType,
                status: 'draft',
                updated: new Date().toISOString(),
                position: 'center',
                width: 400,
                elements: template === 'blank' ? [] : getTemplateElements(template)
            };
            db.popups.push(newPopup);
            saveData();
            openEditor(newPopup.id);
        }

        function getTemplateElements(tpl) {
            if (tpl === 'template_lead') {
                return [
                    { id: 'el_1', type: 'heading', content: 'Join Our Newsletter', fontSize: 24, color: '#1e293b' },
                    { id: 'el_2', type: 'text', content: 'Get the latest updates sent to your inbox.', fontSize: 14, color: '#64748b' },
                    { id: 'el_3', type: 'button', content: 'Subscribe Now', fontSize: 16, color: '#ffffff', link: '#', bg: '#4f46e5' }
                ];
            }
            return [];
        }

        function deletePopup(id) {
            if(confirm('Are you sure?')) {
                db.popups = db.popups.filter(p => p.id !== id);
                saveData();
                loadDashboard();
            }
        }

        function openEditor(id) {
            router('editor', id);
        }

        // --- EDITOR LOGIC ---
        let currentPopupId = null;
        let selectedElementId = null;

        const editor = {
            dragStart: (ev, type) => {
                ev.dataTransfer.setData("type", type);
            },
            allowDrop: (ev) => {
                ev.preventDefault();
            },
            drop: (ev) => {
                ev.preventDefault();
                const type = ev.dataTransfer.getData("type");
                if (!type) return;
                
                const elData = createNewElement(type);
                addElementToCanvas(elData);
            },
            togglePreview: () => {
                // Implement preview logic (clone popup to overlay)
                alert('Preview Mode: In full version, this opens the live popup overlay.');
            },
            deselect: () => {
                selectedElementId = null;
                document.querySelectorAll('.selected-element').forEach(el => el.classList.remove('selected-element'));
                document.getElementById('propsElement').classList.add('hidden');
                document.getElementById('propsGlobal').classList.remove('hidden');
            },
            updateSelectedElement: () => {
                if (!selectedElementId) return;
                const popup = db.popups.find(p => p.id === currentPopupId);
                const el = popup.elements.find(e => e.id === selectedElementId);
                
                // Update from inputs
                el.content = document.getElementById('propContent').value;
                el.fontSize = parseInt(document.getElementById('propFontSize').value);
                el.color = document.getElementById('propColor').value;
                el.link = document.getElementById('propLink').value;
                
                saveData();
                renderCanvas(); // Re-render to show changes
            }
        };

        function createNewElement(type) {
            const id = 'el_' + Date.now();
            const base = { id, type, content: 'New ' + type, fontSize: 16, color: '#333' };
            if (type === 'button') base.bg = '#4f46e5';
            if (type === 'heading') base.fontSize = 24;
            return base;
        }

        function addElementToCanvas(elData) {
            const popup = db.popups.find(p => p.id === currentPopupId);
            popup.elements.push(elData);
            saveData();
            renderCanvas();
        }

        function initEditor(popupId) {
            currentPopupId = popupId;
            const popup = db.popups.find(p => p.id === popupId);
            
            // Fill Global Props
            document.getElementById('propPopupName').value = popup.name;
            document.getElementById('propPosition').value = popup.position;
            document.getElementById('propWidth').value = popup.width;
            
            // Listen for global changes
            document.getElementById('propPosition').onchange = (e) => {
                popup.position = e.target.value;
                applyPopupStyles();
                saveData();
            };
            document.getElementById('propWidth').oninput = (e) => {
                popup.width = e.target.value;
                applyPopupStyles();
                saveData();
            };

            renderCanvas();
            applyPopupStyles();
        }

        function renderCanvas() {
            const zone = document.getElementById('popupContentZone');
            const popup = db.popups.find(p => p.id === currentPopupId);
            
            zone.innerHTML = '';
            if (popup.elements.length === 0) {
                zone.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-slate-300 pointer-events-none"><span class="text-sm">Drag elements here</span></div>';
                return;
            }

            popup.elements.forEach(el => {
                const div = document.createElement('div');
                div.className = 'mb-2 p-2 hover:bg-slate-50 rounded relative group cursor-pointer';
                if (selectedElementId === el.id) div.classList.add('selected-element');
                
                div.onclick = (e) => {
                    e.stopPropagation();
                    selectElement(el);
                };

                // Render Content based on type
                let inner = '';
                if (el.type === 'heading') inner = `<h2 style="font-size:${el.fontSize}px; color:${el.color}; margin:0;">${el.content}</h2>`;
                else if (el.type === 'text') inner = `<p style="font-size:${el.fontSize}px; color:${el.color}; margin:0;">${el.content}</p>`;
                else if (el.type === 'button') inner = `<button style="font-size:${el.fontSize}px; color:${el.color || '#fff'}; background:${el.bg || '#4f46e5'}; padding:8px 16px; border:none; border-radius:4px; cursor:pointer;">${el.content}</button>`;
                else if (el.type === 'image') inner = `<div class="w-full h-32 bg-slate-200 flex items-center justify-center text-slate-400"><i class="fas fa-image text-2xl"></i></div>`;
                else if (el.type === 'video') inner = `<div class="w-full h-40 bg-black flex items-center justify-center text-white"><i class="fas fa-play"></i></div>`;
                else if (el.type === 'divider') inner = `<hr class="border-slate-200">`;
                else if (el.type === 'social') inner = `<div class="flex gap-2 text-slate-400"><i class="fab fa-facebook"></i><i class="fab fa-twitter"></i><i class="fab fa-instagram"></i></div>`;

                div.innerHTML = `
                    ${inner}
                    <div class="delete-btn" onclick="deleteElement('${el.id}', event)"><i class="fas fa-times"></i></div>
                    <div class="element-handle"></div>
                `;
                zone.appendChild(div);
            });
        }

        function deleteElement(id, ev) {
            ev.stopPropagation();
            const popup = db.popups.find(p => p.id === currentPopupId);
            popup.elements = popup.elements.filter(e => e.id !== id);
            selectedElementId = null;
            saveData();
            renderCanvas();
            editor.deselect();
        }

        function selectElement(el) {
            selectedElementId = el.id;
            renderCanvas(); // Update selection outline
            
            // Show Props
            document.getElementById('propsGlobal').classList.add('hidden');
            document.getElementById('propsElement').classList.remove('hidden');
            document.getElementById('selectedElType').innerText = el.type;
            
            document.getElementById('propContent').value = el.content;
            document.getElementById('propFontSize').value = el.fontSize;
            document.getElementById('propColor').value = el.color;
            document.getElementById('propLink').value = el.link || '';
        }

        function applyPopupStyles() {
            const popupEl = document.getElementById('editorPopup');
            const popup = db.popups.find(p => p.id === currentPopupId);
            
            popupEl.style.width = popup.width + 'px';
            
            // Position Logic for Editor (Visual only, keeps centered in flow but changes alignment class maybe?)
            // Requirement: Editor canvas remains stable/centered. Position only affects Preview.
            // So we do NOTHING to the editor layout here, just save the data.
            // But let's give a visual hint? No, let's stick to requirements strictly.
        }

        function saveProject() {
            const popup = db.popups.find(p => p.id === currentPopupId);
            popup.name = document.getElementById('propPopupName').value;
            popup.updated = new Date().toISOString();
            saveData();
            alert('Project Saved Successfully!');
        }

        // Start App
        init();

    </script>
</body>
